<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Text to Image</title>
    <style>
        :root {
            --bg: #1C1916;
            --surface: #25211C;
            --surface-strong: #2E2924;
            --border: #3A332B;
            --border-hover: #5A4D3D;
            --text: #EFE6D5;
            --text-muted: #A39A8C;
            --text-dim: #6E6358;
            --clay: #D4844C;
            --clay-soft: #E5A77A;
            --clay-deep: #8B4A28;
            --danger: #F87171;
            --success: #4ADE80;
            --radius: 8px;
            --transition: 150ms ease-out;
            --serif: 'Iowan Old Style', 'Charter', 'Bookerly', Georgia, serif;
            --sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { color-scheme: dark; }
        body {
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.5;
            background: var(--bg);
            min-height: 100vh;
            padding: 48px 24px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 860px; margin: 0 auto; }
        h1 {
            font-family: var(--serif);
            font-size: 26px;
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-family: var(--serif);
            font-style: italic;
            margin-bottom: 32px;
            font-size: 14px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: color var(--transition);
        }
        .back-link:hover { color: var(--text); }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-family: var(--serif);
            font-style: italic;
            color: var(--text);
            font-size: 14px;
        }
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: flex-start;
        }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .swatches { display: flex; gap: 6px; align-items: center; }
        .bg-swatch {
            width: 24px; height: 24px;
            border-radius: 50%;
            border: 1px solid var(--border-hover);
            cursor: pointer;
            padding: 0;
            flex: none;
            min-width: 0;
        }
        .bg-swatch.active { outline: 2px solid var(--clay); outline-offset: 2px; }
        input[type="color"] {
            width: 32px; height: 24px;
            border: 1px solid var(--border-hover);
            border-radius: 4px;
            background: none;
            cursor: pointer;
            padding: 0;
        }
        .radio-group { display: flex; gap: 16px; }
        .radio-group label {
            font-family: var(--sans);
            font-style: normal;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .preview-wrap {
            margin: 16px 0;
            padding: 24px;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: auto;
            text-align: center;
        }
        /* 预览卡片：固定内边距/圆角/阴影，是导出内容的所见即所得 */
        #preview-card {
            display: inline-block;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            background: #25211C;
            text-align: left;
        }
        #preview-text {
            font-family: var(--mono);
            font-size: 14px;
            line-height: 1.6;
            color: #e6e6e6;
            margin: 0;
            white-space: pre;
            outline: none;
            min-width: 1ch;
            min-height: 1.6em;
        }
        /* 空态占位提示（仅当无内容时显示 data-placeholder） */
        #preview-text:empty::before {
            content: attr(data-placeholder);
            color: var(--text-dim);
        }
        #preview-card.wrap #preview-text {
            white-space: pre-wrap;
            word-break: break-word;
            max-width: 640px;
        }
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            min-width: 96px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }
        button:hover { background: var(--surface-strong); border-color: var(--border-hover); }
        .btn-primary { background: var(--clay); color: var(--bg); border-color: var(--clay); }
        .btn-primary:hover { background: var(--clay-soft); border-color: var(--clay-soft); }
        .btn-clear:hover { color: var(--danger); border-color: rgba(248,113,113,0.3); }
        .message {
            position: fixed;
            top: 16px; right: 16px;
            padding: 8px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 13px;
            display: none;
            z-index: 1000;
        }
        .message.success { display: block; color: var(--success); border-color: rgba(74,222,128,0.3); }
        .message.error { display: block; color: var(--danger); border-color: rgba(248,113,113,0.3); }
        ::selection { background: rgba(213,132,76,0.35); color: var(--text); }
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid var(--bg); }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }
        :focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; border-radius: 3px; }
        button:focus-visible, a:focus-visible { outline-offset: 3px; }
        @media (max-width: 480px) {
            body { padding: 24px 16px; }
            h1 { font-size: 20px; }
            .card { padding: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← Back to Tools</a>
    <h1>Text to Image</h1>
    <p class="subtitle">Paste text and export a beautiful card image</p>

    <div class="card">
        <div class="controls-row">
            <div class="control-group">
                <label>Background</label>
                <div class="swatches" id="swatches">
                    <button type="button" class="bg-swatch" data-color="#25211C" style="background:#25211C" aria-label="Warm brown"></button>
                    <button type="button" class="bg-swatch" data-color="#1e2233" style="background:#1e2233" aria-label="Dark blue"></button>
                    <button type="button" class="bg-swatch" data-color="#2d2438" style="background:#2d2438" aria-label="Purple"></button>
                    <button type="button" class="bg-swatch" data-color="#8B4A28" style="background:#8B4A28" aria-label="Clay"></button>
                    <button type="button" class="bg-swatch" data-color="#1b3a2f" style="background:#1b3a2f" aria-label="Green"></button>
                    <button type="button" class="bg-swatch" data-color="#f5f0e6" style="background:#f5f0e6" aria-label="Cream"></button>
                    <input type="color" id="bg-color" value="#25211C" aria-label="Custom background color">
                </div>
            </div>
            <div class="control-group">
                <label>Line wrapping</label>
                <div class="radio-group">
                    <label><input type="radio" name="wrap-mode" value="fit" checked> Fit to longest line</label>
                    <label><input type="radio" name="wrap-mode" value="wrap"> Wrap</label>
                </div>
            </div>
        </div>
    </div>

    <div class="preview-wrap">
        <div id="preview-card">
            <pre id="preview-text" contenteditable="plaintext-only" spellcheck="false" data-placeholder="Type or paste your text here..."></pre>
        </div>
    </div>

    <div class="button-group">
        <button id="btn-download" class="btn-primary">Download PNG</button>
        <button id="btn-copy">Copy Image</button>
        <button id="btn-clear" class="btn-clear">Clear</button>
    </div>
</div>
<div class="message" id="message" aria-live="polite"></div>

<script>
const previewCard = document.getElementById('preview-card');
const previewText = document.getElementById('preview-text');
const bgColorEl = document.getElementById('bg-color');
const swatchesEl = document.getElementById('swatches');
const messageEl = document.getElementById('message');

function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = 'message ' + type;
    setTimeout(() => { messageEl.className = 'message'; }, 3000);
}

function escapeHtml(text) {
    return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

// 读取可编辑卡片的纯文本，跨引擎保留换行：
// Chromium 用 <br> 表示换行、textContent 会丢失；WebKit 用 \n 文本节点。
// 统一遍历子节点：文本节点取其文本，<br> 转 \n，块级元素(<div>/<p>)边界补 \n。
function getEditorText() {
    let out = '';
    const walk = (node) => {
        node.childNodes.forEach((child) => {
            if (child.nodeType === Node.TEXT_NODE) {
                out += child.nodeValue;
            } else if (child.nodeName === 'BR') {
                out += '\n';
            } else if (child.nodeType === Node.ELEMENT_NODE) {
                // 块级容器（部分引擎换行会包 <div>）前补换行
                const display = getComputedStyle(child).display;
                if (out && !out.endsWith('\n') && (display === 'block' || child.nodeName === 'DIV' || child.nodeName === 'P')) {
                    out += '\n';
                }
                walk(child);
            }
        });
    };
    walk(previewText);
    return out;
}

// contenteditable 删空后常残留 <br>，使 :empty 失效导致 placeholder 不恢复；
// 仅当没有任何真实字符时清残留。用 textContent==='' 判据（<br> 不计入 textContent），
// 这样删空的残留 <br> 会被清掉，而用户敲的空格/缩进（textContent 非空）会保留。
previewText.addEventListener('input', () => {
    if (previewText.textContent === '' && previewText.innerHTML !== '') {
        previewText.innerHTML = '';
    }
});

function getOptions() {
    const wrapMode = document.querySelector('input[name="wrap-mode"]:checked').value;
    return { bgColor: bgColorEl.value, wrapMode };
}

function renderPreview() {
    const opts = getOptions();
    previewCard.style.background = opts.bgColor;
    previewCard.classList.toggle('wrap', opts.wrapMode === 'wrap');
    // 浅色背景时文字自动转深色，保证可读
    previewText.style.color = isLight(opts.bgColor) ? '#1a1a1a' : '#e6e6e6';
}

// 判断颜色明暗（相对亮度阈值）
function isLight(hex) {
    const m = hex.replace('#', '');
    const r = parseInt(m.substring(0, 2), 16);
    const g = parseInt(m.substring(2, 4), 16);
    const b = parseInt(m.substring(4, 6), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.6;
}

// 预设色块点选
swatchesEl.querySelectorAll('.bg-swatch').forEach(btn => {
    btn.addEventListener('click', () => {
        const color = btn.getAttribute('data-color');
        bgColorEl.value = color;
        updateActiveSwatch(color);
        renderPreview();
    });
});

function updateActiveSwatch(color) {
    swatchesEl.querySelectorAll('.bg-swatch').forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-color').toLowerCase() === color.toLowerCase());
    });
}

bgColorEl.addEventListener('input', () => { updateActiveSwatch(bgColorEl.value); renderPreview(); });
document.querySelectorAll('input[name="wrap-mode"]').forEach(r => r.addEventListener('change', renderPreview));

// 初始化
updateActiveSwatch(bgColorEl.value);
renderPreview();

// 剥离 XML 1.0 非法控制字符（保留 Tab/LF/CR）；否则 SVG 解析失败导致导出报错
function stripInvalidXmlChars(text) {
    return text.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
}

// 与预览卡片视觉一致的 inline 样式卡片（供 foreignObject 使用）
function buildCardHTML(text, opts) {
    text = stripInvalidXmlChars(text);
    const color = isLight(opts.bgColor) ? '#1a1a1a' : '#e6e6e6';
    const wrapStyle = opts.wrapMode === 'wrap'
        ? 'white-space:pre-wrap;word-break:break-word;max-width:640px;'
        : 'white-space:pre;';
    const mono = "ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace";
    return (
        '<div xmlns="http://www.w3.org/1999/xhtml" style="' +
            'display:inline-block;padding:32px;border-radius:12px;' +
            'box-shadow:0 20px 50px rgba(0,0,0,0.35);' +
            'background:' + opts.bgColor + ';">' +
            '<pre style="margin:0;font-family:' + mono + ';font-size:14px;' +
            'line-height:1.6;color:' + color + ';' + wrapStyle + '">' +
            escapeHtml(text) +
            '</pre>' +
        '</div>'
    );
}

// 测量当前预览卡片渲染后的像素尺寸
function measureCard() {
    const rect = previewCard.getBoundingClientRect();
    return { width: Math.ceil(rect.width), height: Math.ceil(rect.height) };
}

function htmlToSvg(html, width, height) {
    return (
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + width + '" height="' + height + '">' +
            '<foreignObject width="100%" height="100%">' + html + '</foreignObject>' +
        '</svg>'
    );
}

// 导出画布相对卡片四周预留的透明边距，防止 box-shadow 被裁切。
// 阴影 0 20px 50px 向下延伸约 offset+blur=70px，故取 80 确保四边（含底部）都留足。
const EXPORT_MARGIN = 80;

// 完整管线：HTML → SVG → <img> → canvas（scale 倍清晰度）
function renderToCanvas(scale) {
    scale = scale || 2;
    return new Promise((resolve, reject) => {
        const opts = getOptions();
        const text = getEditorText() || '';
        const { width, height } = measureCard();
        // 卡片外包一层透明 padding 容器，让 box-shadow 在 SVG/canvas 边界内有展开空间
        const exportHtml = (
            '<div xmlns="http://www.w3.org/1999/xhtml" style="display:inline-block;padding:' + EXPORT_MARGIN + 'px;">' +
                buildCardHTML(text, opts) +
            '</div>'
        );
        const svgWidth = width + EXPORT_MARGIN * 2;
        const svgHeight = height + EXPORT_MARGIN * 2;
        const svg = htmlToSvg(exportHtml, svgWidth, svgHeight);
        const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        const img = new Image();
        img.onload = () => {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = svgWidth * scale;
                canvas.height = svgHeight * scale;
                const ctx = canvas.getContext('2d');
                ctx.scale(scale, scale);
                // 仅捕获绘制过程中的意外错误；canvas 因跨域内容被污染的 SecurityError
                // 不会在 drawImage 时抛出，而是在后续 toDataURL/toBlob 时才出现
                ctx.drawImage(img, 0, 0);
                resolve(canvas);
            } catch (e) {
                reject(e);
            }
        };
        img.onerror = () => reject(new Error('Failed to render SVG image'));
        img.src = svgUrl;
    });
}

const btnDownload = document.getElementById('btn-download');
const btnCopy = document.getElementById('btn-copy');
const btnClear = document.getElementById('btn-clear');

function hasText() {
    if (!getEditorText().trim()) {
        showMessage('Please enter some text first', 'error');
        return false;
    }
    return true;
}

async function downloadPng() {
    if (!hasText()) return;
    try {
        const canvas = await renderToCanvas(2);
        const url = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = url;
        a.download = 'text2img.png';
        a.click();
        showMessage('Downloaded PNG', 'success');
    } catch (e) {
        showMessage('Export failed: ' + e.message, 'error');
    }
}

async function copyImage() {
    if (!hasText()) return;
    // 能力检测：ClipboardItem 在 file:// 或非 HTTPS 常不可用
    if (typeof ClipboardItem === 'undefined' || !navigator.clipboard || !navigator.clipboard.write) {
        showMessage('Copy not supported here — use Download instead', 'error');
        return;
    }
    try {
        const canvas = await renderToCanvas(2);
        canvas.toBlob(async (blob) => {
            if (!blob) { showMessage('Export failed: empty image', 'error'); return; }
            try {
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                showMessage('Image copied to clipboard', 'success');
            } catch (e) {
                showMessage('Copy failed: ' + e.message + ' — use Download instead', 'error');
            }
        }, 'image/png');
    } catch (e) {
        showMessage('Export failed: ' + e.message, 'error');
    }
}

function clearAll() {
    previewText.textContent = '';
    renderPreview();
    showMessage('Cleared', 'success');
}

btnDownload.addEventListener('click', downloadPng);
btnCopy.addEventListener('click', copyImage);
btnClear.addEventListener('click', clearAll);
</script>
</body>
</html>
