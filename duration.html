<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Duration Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet" integrity="sha384-RkASv+6KfBMW9eknReJIJ6b3UnjKOKC5bOUaNgIY778NFbQ8MtWq9Lr/khUgqtTt" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/themes/dark.css" rel="stylesheet" integrity="sha384-heUUtXw0Djj2DElfLOVPlASSWFKNL3JDY6s3FEqQD03GYyWOeophY5DsfEG40sYX" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/plugins/confirmDate/confirmDate.css" rel="stylesheet" integrity="sha384-3jTClu/3JqBwih+Ma7jF0YnLO572TuXNBiY3ZR1ML7E0dSTbxpUdlRSCHCXDV6i/" crossorigin="anonymous">
    <style>
        :root {
            --bg: #1C1916;
            --surface: #25211C;
            --surface-strong: #2E2924;
            --border: #3A332B;
            --border-hover: #5A4D3D;
            --text: #EFE6D5;
            --text-muted: #A39A8C;
            --text-dim: #6E6358;
            --clay: #D4844C;
            --clay-soft: #E5A77A;
            --clay-deep: #8B4A28;
            --burgundy: #A85B3C;
            --danger: #F87171;
            --warn: #F59E0B;
            --success: #4ADE80;
            --info: #93C5FD;
            --radius: 8px;
            --transition: 150ms ease-out;
            --serif: 'Iowan Old Style', 'Charter', 'Bookerly', Georgia, serif;
            --sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background: var(--bg);
            min-height: 100vh;
            padding: 48px 24px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--serif);
            font-size: 26px;
            font-weight: 400;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-family: var(--serif);
            font-style: italic;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: var(--text);
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            color: var(--text);
            font-size: 14px;
        }

        input[type="text"] {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text);
            font-size: 13px;
            font-family: inherit;
            transition: border-color var(--transition);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--border-hover);
        }

        input[type="text"]::placeholder {
            color: var(--text-dim);
        }

        /* Flatpickr customization */
        .flatpickr-calendar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        .flatpickr-calendar.arrowTop:before,
        .flatpickr-calendar.arrowTop:after {
            border-bottom-color: var(--surface);
        }

        .flatpickr-months .flatpickr-month {
            background: transparent;
            color: var(--text);
        }

        .flatpickr-current-month .flatpickr-monthDropdown-months,
        .flatpickr-current-month input.cur-year {
            color: var(--text);
            font-weight: 500;
        }

        .flatpickr-monthDropdown-months:hover {
            background: var(--surface-strong);
        }

        .flatpickr-months .flatpickr-prev-month,
        .flatpickr-months .flatpickr-next-month {
            color: var(--text);
            fill: var(--text);
        }

        .flatpickr-months .flatpickr-prev-month:hover,
        .flatpickr-months .flatpickr-next-month:hover {
            color: var(--text);
        }

        .flatpickr-months .flatpickr-prev-month:hover svg,
        .flatpickr-months .flatpickr-next-month:hover svg {
            fill: var(--text);
        }

        .flatpickr-weekdays {
            background: transparent;
        }

        span.flatpickr-weekday {
            color: var(--text-dim);
            font-weight: 500;
        }

        .flatpickr-days {
            background: transparent;
        }

        .flatpickr-day {
            color: var(--text-muted);
            border-radius: 4px;
        }

        .flatpickr-day:hover {
            background: var(--surface-strong);
            border-color: transparent;
        }

        .flatpickr-day.selected {
            background: var(--clay);
            border-color: var(--clay);
            color: var(--bg);
        }

        .flatpickr-day.today {
            border-color: var(--border-hover);
        }

        .flatpickr-day.today:hover {
            background: var(--surface-strong);
        }

        .flatpickr-day.prevMonthDay,
        .flatpickr-day.nextMonthDay {
            color: var(--text-dim);
            opacity: 0.5;
        }

        .flatpickr-time {
            background: transparent;
            border-top: 1px solid var(--border);
        }

        .flatpickr-time input {
            color: var(--text);
            font-size: 14px;
        }

        .flatpickr-time input:hover,
        .flatpickr-time input:focus {
            background: var(--surface-strong);
        }

        .flatpickr-time .flatpickr-time-separator,
        .flatpickr-time .flatpickr-am-pm {
            color: var(--text);
        }

        .flatpickr-time .flatpickr-am-pm:hover {
            background: var(--surface-strong);
        }

        .numInputWrapper:hover {
            background: var(--surface);
        }

        .numInputWrapper span {
            border-color: var(--border);
        }

        .numInputWrapper span:hover {
            background: var(--surface-strong);
        }

        .numInputWrapper span:after {
            border-color: var(--text) transparent transparent transparent;
        }

        .numInputWrapper span.arrowUp:after {
            border-bottom-color: var(--text);
        }

        .numInputWrapper span.arrowDown:after {
            border-top-color: var(--text);
        }

        .flatpickr-confirm {
            background: var(--clay);
            color: var(--bg);
            border: none;
            font-weight: 500;
            padding: 9px;
            cursor: pointer;
            transition: background var(--transition);
        }

        .flatpickr-confirm:hover {
            background: var(--clay-soft);
        }

        .end-time-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .end-time-row input[type="text"] {
            flex: 1;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: var(--clay);
            cursor: pointer;
        }

        .checkbox-wrapper label {
            margin: 0;
            cursor: pointer;
            font-family: var(--serif);
            font-style: italic;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 400;
        }

        .result-card {
            background: var(--surface);
        }

        .result {
            text-align: center;
        }

        .result-value {
            font-size: 40px;
            font-weight: 400;
            color: var(--clay);
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
        }

        .result-breakdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .result-item {
            text-align: center;
            min-width: 64px;
        }

        .result-item-value {
            font-size: 22px;
            font-weight: 500;
            color: var(--text);
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
        }

        .result-item-label {
            font-family: var(--serif);
            font-style: italic;
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .result-total {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .negative {
            color: var(--danger) !important;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            margin-bottom: 16px;
        }

        button {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }

        button:hover:not(:disabled) {
            background: var(--surface-strong);
            border-color: var(--border-hover);
        }

        .btn-calculate {
            background: var(--clay);
            color: var(--bg);
            border-color: var(--clay);
        }

        .btn-calculate:hover {
            background: var(--clay-soft);
            border-color: var(--clay-soft);
        }

        .btn-clear:hover {
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.3);
        }

        .btn-share:disabled {
            color: var(--text-dim);
            cursor: not-allowed;
        }

        .message {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 8px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 13px;
            display: none;
            z-index: 1000;
        }

        .message.error {
            display: block;
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.3);
        }

        .message.success {
            display: block;
            color: var(--success);
            border-color: rgba(74, 222, 128, 0.3);
        }

        .live-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(74, 222, 128, 0.10);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.25);
            border-radius: 999px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            animation: pulse 1.5s infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        @media (max-width: 480px) {
            body {
                padding: 24px 16px;
            }

            h1 {
                font-size: 20px;
            }

            .card {
                padding: 14px;
            }

            .result-value {
                font-size: 28px;
            }

            .result-item-value {
                font-size: 18px;
            }

            .result-breakdown {
                gap: 12px;
            }

            .result-item {
                min-width: 56px;
            }
        }

        /* Flatpickr — editorial complete state coverage */
        .flatpickr-day:focus {
            background: var(--surface-strong);
            border-color: transparent;
            outline: none;
        }

        .flatpickr-day.inRange,
        .flatpickr-day.prevMonthDay.inRange,
        .flatpickr-day.nextMonthDay.inRange,
        .flatpickr-day.today.inRange,
        .flatpickr-day:hover.inRange {
            background: rgba(213, 132, 76, 0.12);
            border-color: transparent;
            box-shadow: -5px 0 0 rgba(213, 132, 76, 0.12), 5px 0 0 rgba(213, 132, 76, 0.12);
            color: var(--text);
        }

        .flatpickr-day.startRange,
        .flatpickr-day.endRange,
        .flatpickr-day.startRange.inRange,
        .flatpickr-day.endRange.inRange,
        .flatpickr-day.startRange:hover,
        .flatpickr-day.endRange:hover {
            background: var(--clay);
            border-color: var(--clay);
            color: var(--bg);
        }

        .flatpickr-day.startRange.startRange + .endRange:not(:nth-child(7n+1)),
        .flatpickr-day.endRange.endRange + .endRange:not(:nth-child(7n+1)) {
            box-shadow: -10px 0 0 var(--clay);
        }

        .flatpickr-day.flatpickr-disabled,
        .flatpickr-day.flatpickr-disabled:hover {
            color: var(--text-dim);
            opacity: 0.35;
            background: transparent;
            cursor: not-allowed;
        }

        .flatpickr-day.week.selected {
            background: var(--clay);
            color: var(--bg);
        }

        .flatpickr-day.today.selected {
            background: var(--clay);
            border-color: var(--clay);
            color: var(--bg);
        }

        /* Time input arrows */
        .numInputWrapper:hover {
            background: var(--surface-strong);
        }

        .numInputWrapper span:hover {
            background: rgba(213, 132, 76, 0.18);
        }

        .numInputWrapper span:hover:after {
            border-bottom-color: var(--clay) !important;
            border-top-color: var(--clay) !important;
        }

        /* Editorial system-level: text selection, scrollbar, keyboard focus */
        ::selection {
            background: rgba(213, 132, 76, 0.35);
            color: var(--text);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
            border: 2px solid var(--bg);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        :focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: 2px;
            border-radius: 3px;
        }

        button:focus-visible,
        a:focus-visible {
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <div class="container">
        <a class="back-link" href="index.html">← Back to Tools</a>
        <h1>Duration Calculator</h1>
        <p class="subtitle">Calculate the time difference between two dates</p>

        <div class="card">
            <label for="start">Start Time</label>
            <input id="start" placeholder="Select start time" type="text">
        </div>

        <div class="card">
            <label for="end">End Time</label>
            <div class="end-time-row">
                <input id="end" placeholder="Select end time" type="text">
                <div class="checkbox-wrapper">
                    <input id="useNow" type="checkbox">
                    <label for="useNow">NOW</label>
                </div>
            </div>
        </div>

        <div class="card name-card">
            <label for="name">Name (optional)</label>
            <input id="name" placeholder="e.g. Project started, Vacation days..." type="text">
        </div>

        <div class="button-group">
            <button class="btn-calculate" onclick="calculate()">Calculate</button>
            <button class="btn-share" disabled id="shareBtn" onclick="shareUrl()">Share</button>
            <button class="btn-clear" onclick="clearAll()">Clear</button>
        </div>

        <div class="message" id="message" aria-live="polite"></div>

        <div class="card result-card" id="resultCard" style="display: none;">
            <div class="result">
                <div id="resultTitle" style="color: var(--text-muted); margin-bottom: 10px; font-size: 13px;">Duration</div>
                <div class="result-value" id="resultValue"></div>
                <div class="result-breakdown">
                    <div class="result-item">
                        <div class="result-item-value" id="days">0</div>
                        <div class="result-item-label">Days</div>
                    </div>
                    <div class="result-item">
                        <div class="result-item-value" id="hours">0</div>
                        <div class="result-item-label">Hours</div>
                    </div>
                    <div class="result-item">
                        <div class="result-item-value" id="minutes">0</div>
                        <div class="result-item-label">Minutes</div>
                    </div>
                    <div class="result-item">
                        <div class="result-item-value" id="seconds">0</div>
                        <div class="result-item-label">Seconds</div>
                    </div>
                </div>
                <div class="result-total" id="totalSeconds"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.js" integrity="sha384-sWZVghjWvu7FLPv6FOuk8kWJYnlZApKfPfxhdPgM1gcwvD0ys/iFrhE3Xr76HJV3" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/plugins/confirmDate/confirmDate.js" integrity="sha384-McA887YbcGr7qipNmeAuJdiiKF+veAEkbhSM+gQjenqgJCNDa/T9kkRFPTG0sa13" crossorigin="anonymous"></script>
    <script>
        const startEl = document.getElementById('start');
        const endEl = document.getElementById('end');
        const useNowEl = document.getElementById('useNow');
        const nameEl = document.getElementById('name');
        const resultCardEl = document.getElementById('resultCard');
        const resultTitleEl = document.getElementById('resultTitle');
        const resultValueEl = document.getElementById('resultValue');
        const messageEl = document.getElementById('message');

        let intervalId = null;
        let startPicker, endPicker;

        // Initialize Flatpickr
        const flatpickrConfig = {
            enableTime: true,
            dateFormat: "Y-m-d H:i",
            time_24hr: true,
            allowInput: true,
            disableMobile: true,
            plugins: [new confirmDatePlugin({})]
        };

        const twoDaysAgo = new Date();
        twoDaysAgo.setDate(twoDaysAgo.getDate() - 2);
        twoDaysAgo.setSeconds(0, 0);
        startPicker = flatpickr(startEl, {
            ...flatpickrConfig,
            defaultDate: twoDaysAgo,
            onChange: (selectedDates) => {
                if (selectedDates.length > 0) {
                    selectedDates[0].setSeconds(0, 0);
                }
            }
        });

        endPicker = flatpickr(endEl, {
            ...flatpickrConfig,
            onChange: (selectedDates) => {
                if (!useNowEl.checked && selectedDates.length > 0) {
                    selectedDates[0].setSeconds(0, 0);
                }
            }
        });

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            setTimeout(() => {
                messageEl.className = 'message';
            }, 3000);
        }

        function formatDateTime(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const seconds = String(date.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        }

        function updateNowDisplay() {
            if (useNowEl.checked) {
                endEl.value = formatDateTime(new Date());
            }
        }

        // Clear hash when user modifies time
        function clearHash() {
            if (window.location.hash) {
                history.replaceState(null, null, window.location.pathname);
            }
        }

        useNowEl.addEventListener('change', function () {
            clearHash();
            if (this.checked) {
                endPicker.clear();
                updateNowDisplay();
                if (intervalId) clearInterval(intervalId);
                intervalId = setInterval(() => {
                    updateNowDisplay();
                    if (resultCardEl.style.display !== 'none') {
                        calculate();
                    }
                }, 1000);
            } else {
                // Set end time to current time (without seconds)
                const now = new Date();
                now.setSeconds(0, 0);
                endPicker.setDate(now);
                if (intervalId) {
                    clearInterval(intervalId);
                    intervalId = null;
                }
            }
            updateShareButton();
        });

        // Listen for Flatpickr changes to update share button and clear hash
        startEl.addEventListener('change', () => {
            updateShareButton();
            clearHash();
        });
        endEl.addEventListener('change', () => {
            updateShareButton();
            clearHash();
        });

        function calculate() {
            const startDate = startPicker.selectedDates[0];
            if (!startDate) {
                showMessage('Please enter a start time', 'error');
                return;
            }

            let end;
            if (useNowEl.checked) {
                end = new Date();
            } else {
                const endDate = endPicker.selectedDates[0];
                if (!endDate) {
                    showMessage('Please enter an end time or use NOW', 'error');
                    return;
                }
                end = endDate;
            }

            let diff = end - startDate;
            const isNegative = diff < 0;
            diff = Math.abs(diff);

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            // Format main display
            let parts = [];
            if (days > 0) parts.push(days + 'd');
            if (hours > 0 || days > 0) parts.push(hours + 'h');
            if (minutes > 0 || hours > 0 || days > 0) parts.push(minutes + 'm');
            parts.push(seconds + 's');

            const displayValue = (isNegative ? '-' : '') + parts.join(' ');

            // Update UI
            resultCardEl.style.display = 'block';
            resultValueEl.textContent = displayValue;
            resultValueEl.className = 'result-value' + (isNegative ? ' negative' : '');

            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;

            const totalSeconds = Math.floor(diff / 1000);
            document.getElementById('totalSeconds').textContent =
                `Total: ${totalSeconds.toLocaleString()} seconds`;

            // Update title (use name if provided, otherwise "Duration")
            const name = nameEl.value.trim();
            let titleText = name || 'Duration';
            if (isNegative && !name) {
                titleText = 'Duration (negative)';
            }

            if (useNowEl.checked) {
                // Set title text safely
                resultTitleEl.textContent = titleText;

                // Create and append badge element
                const badge = document.createElement('span');
                badge.className = 'live-badge';
                badge.textContent = 'LIVE';
                resultTitleEl.appendChild(badge);
            } else {
                resultTitleEl.textContent = titleText;
            }
        }

        function clearAll() {
            startPicker.clear();
            endPicker.clear();
            endEl.value = '';
            nameEl.value = '';
            useNowEl.checked = false;
            resultCardEl.style.display = 'none';
            messageEl.className = 'message';

            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }

            clearHash();
            updateShareButton();
        }

        // Base62 charset
        const BASE62 = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';

        // Encode number to Base62
        function encodeBase62(num) {
            if (num === 0n) return '0';
            let arr = [];
            while (num > 0n) {
                arr.push(BASE62[Number(num % 62n)]);
                num = num / 62n;
            }
            return arr.reverse().join('');
        }

        // Decode Base62 to number
        function decodeBase62(str) {
            let num = 0n;
            for (let i = 0; i < str.length; i++) {
                const idx = BASE62.indexOf(str[i]);
                if (idx === -1) throw new Error('Invalid character');
                num = num * 62n + BigInt(idx);
            }
            return num;
        }

        // NOW marker (max 32-bit value: 4294967295)
        const NOW_MARKER = 0xFFFFFFFF;

        // Base64URL encode (URL-safe, no padding)
        function encodeBase64URL(str) {
            const bytes = new TextEncoder().encode(str);
            let binary = '';
            bytes.forEach(b => binary += String.fromCharCode(b));
            return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        // Base64URL decode
        function decodeBase64URL(str) {
            str = str.replace(/-/g, '+').replace(/_/g, '/');
            while (str.length % 4) str += '=';
            const binary = atob(str);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return new TextDecoder().decode(bytes);
        }

        // Encode share data to Base62
        function encodeShareData(startTs, endTs, isNow) {
            // If NOW mode, use marker for endTs
            const endValue = isNow ? NOW_MARKER : endTs;
            // Pack two 32-bit timestamps into a single number
            // startTs in high 32 bits, endTs in low 32 bits
            const packed = (BigInt(startTs) << 32n) | BigInt(endValue);
            return encodeBase62(packed);
        }

        // Decode share data from Base62
        function decodeShareData(base62) {
            try {
                const packed = decodeBase62(base62);
                const startTs = Number(packed >> 32n);
                const endTs = Number(packed & 0xFFFFFFFFn);
                const isNow = endTs === NOW_MARKER;
                return { s: startTs, e: endTs, isNow };
            } catch (e) {
                // Invalid hash, ignore
            }
            return null;
        }

        // Share URL function
        function shareUrl() {
            const startDate = startPicker.selectedDates[0];

            if (!startDate) {
                showMessage('Please set start time', 'error');
                return;
            }

            const startTs = Math.floor(startDate.getTime() / 1000);
            const isNow = useNowEl.checked;
            let endTs = 0;

            if (!isNow) {
                const endDate = endPicker.selectedDates[0];
                if (!endDate) {
                    showMessage('Please set end time or use NOW', 'error');
                    return;
                }
                endTs = Math.floor(endDate.getTime() / 1000);
            }

            const timeHash = encodeShareData(startTs, endTs, isNow);
            const name = nameEl.value.trim();

            // Format: #s={base62} or #s={base62}.{base64url_name}
            let hash = timeHash;
            if (name) {
                hash += '.' + encodeBase64URL(name);
            }

            const url = window.location.origin + window.location.pathname + '#s=' + hash;

            // Update current URL
            history.pushState(null, null, '#s=' + hash);

            navigator.clipboard.writeText(url).then(() => {
                showMessage('Share link copied to clipboard!', 'success');
            }).catch(() => {
                showMessage('Failed to copy link', 'error');
            });
        }

        // Update share button state
        function updateShareButton() {
            const shareBtn = document.getElementById('shareBtn');
            const hasStart = startPicker.selectedDates.length > 0;
            const hasEnd = endPicker.selectedDates.length > 0;
            const isNowMode = useNowEl.checked;

            // Enable if start time is set, and either end time is set or NOW is checked
            shareBtn.disabled = !hasStart || (!hasEnd && !isNowMode);
        }

        // Parse hash on page load
        function parseHash() {
            const hash = window.location.hash;
            if (hash && hash.startsWith('#s=')) {
                const hashContent = hash.substring(3);

                // Check if there's a name: format is {base62}.{base64url_name}
                const dotIndex = hashContent.indexOf('.');
                let timeHash, name = '';

                if (dotIndex !== -1) {
                    timeHash = hashContent.substring(0, dotIndex);
                    try {
                        name = decodeBase64URL(hashContent.substring(dotIndex + 1));
                    } catch (e) {
                        // Invalid name encoding, ignore
                    }
                } else {
                    timeHash = hashContent;
                }

                const data = decodeShareData(timeHash);

                if (data) {
                    const startDate = new Date(data.s * 1000);
                    startDate.setSeconds(0, 0);
                    startPicker.setDate(startDate);

                    if (data.isNow) {
                        // NOW mode
                        useNowEl.checked = true;
                        updateNowDisplay();
                        // Start live update timer
                        if (intervalId) clearInterval(intervalId);
                        intervalId = setInterval(() => {
                            updateNowDisplay();
                            if (resultCardEl.style.display !== 'none') {
                                calculate();
                            }
                        }, 1000);
                    } else {
                        // Fixed end time
                        const endDate = new Date(data.e * 1000);
                        endDate.setSeconds(0, 0);
                        endPicker.setDate(endDate);
                        useNowEl.checked = false;
                    }

                    // Set name if present
                    if (name) {
                        nameEl.value = name;
                    }

                    calculate();
                }
            }
        }

        // Parse hash on load
        parseHash();

        // Update share button state on init
        updateShareButton();
    </script>
</body>
