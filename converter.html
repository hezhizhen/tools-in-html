<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Format Converter</title>
    <!-- Preload JS (script tags are at bottom) -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js" as="script" integrity="sha384-CtBuRlcKITyrd+aBeTPNFB1/T8+kvtNQiWMCLtiGvD6NpLOJAdt8e8PpJJ2Gn1D0" crossorigin="anonymous">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" as="script" integrity="sha384-+pxiN6T7yvpryuJmE1gM9PX7yQit15auDb+ZwwvJOd/4be2Cie5/IuVXgQb/S9du" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" integrity="sha384-phfEUVAmRZV1Pzn/Xgxc3NH6zPMDuer0wHU9jRQKhNBBLyV4MP1gaBY1sxfxxPRT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldgutter.min.css" integrity="sha384-pqEriXSciNL11YIQNgLsDuYg+mjVeF5j+my59ox8KiqRyjCrLa0zDP522jXU9Syp" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.css" integrity="sha384-8Q4oVdkXS0g8qSdedXknw9E+LAgELnjtGG0XlqLny8xVH61TblZLEd1gc0ka8xQs" crossorigin="anonymous">
    <style>
        :root {
            --bg: #1C1916;
            --surface: #25211C;
            --surface-strong: #2E2924;
            --border: #3A332B;
            --border-hover: #5A4D3D;
            --text: #EFE6D5;
            --text-muted: #A39A8C;
            --text-dim: #6E6358;
            --clay: #D4844C;
            --clay-soft: #E5A77A;
            --clay-deep: #8B4A28;
            --burgundy: #A85B3C;
            --danger: #F87171;
            --warn: #F59E0B;
            --success: #4ADE80;
            --info: #93C5FD;
            --radius: 8px;
            --transition: 150ms ease-out;
            --serif: 'Iowan Old Style', 'Charter', 'Bookerly', Georgia, serif;
            --sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background: var(--bg);
            min-height: 100vh;
            padding: 48px 24px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--serif);
            font-size: 26px;
            font-weight: 400;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-family: var(--serif);
            font-style: italic;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: var(--text);
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 12px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        label {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            color: var(--text);
            font-size: 14px;
        }

        .btn-clear-small,
        .btn-copy-small {
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 500;
            background: var(--surface);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            font-family: inherit;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
            flex: none;
        }

        .btn-clear-small:hover,
        .btn-copy-small:hover {
            background: var(--surface-strong);
            color: var(--text);
            border-color: var(--border-hover);
        }

        .btn-clear-small:hover {
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.3);
        }

        .format-badge {
            padding: 2px 8px;
            margin-left: 8px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: var(--surface-strong);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .format-badge:empty {
            display: none;
        }

        .format-buttons {
            display: inline-flex;
            gap: 6px;
            margin-left: 10px;
        }

        .format-buttons .format-btn {
            padding: 4px 10px;
            font-size: 11px;
        }

        .format-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .format-btn:hover {
            background: var(--surface-strong);
            color: var(--text);
            border-color: var(--border-hover);
        }

        .format-btn.active {
            background: var(--clay);
            color: var(--bg);
            border-color: var(--clay);
        }

        .message {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 8px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 13px;
            display: none;
            z-index: 1000;
        }

        .message.success {
            display: block;
            color: var(--success);
            border-color: rgba(74, 222, 128, 0.3);
        }

        .message.error {
            display: block;
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.3);
        }

        .CodeMirror {
            background: rgba(0, 0, 0, 0.3) !important;
            height: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.55;
            transition: border-color var(--transition);
        }

        .CodeMirror-focused {
            border-color: var(--border-hover) !important;
        }

        .CodeMirror-gutters {
            background: rgba(0, 0, 0, 0.2) !important;
            border-right: 1px solid var(--border) !important;
        }

        .CodeMirror-linenumber {
            color: var(--text-dim) !important;
            padding: 0 8px 0 3px !important;
            min-width: 2em;
            text-align: right;
        }

        .CodeMirror-lines {
            padding: 12px 0;
        }

        .CodeMirror-selected {
            background: rgba(255, 255, 255, 0.08) !important;
        }

        .CodeMirror-cursor {
            border-left: 1px solid var(--clay) !important;
        }

        .CodeMirror-matchingbracket {
            color: var(--text) !important;
            background: rgba(255, 255, 255, 0.12) !important;
            font-weight: 600;
            border-radius: 2px;
            padding: 0 2px;
            margin: 0 -2px;
        }

        .CodeMirror-nonmatchingbracket {
            color: var(--danger) !important;
            background: rgba(248, 113, 113, 0.15) !important;
            border-radius: 2px;
        }

        .CodeMirror-foldgutter {
            width: 1.2em;
        }

        .CodeMirror-foldgutter-open,
        .CodeMirror-foldgutter-folded {
            cursor: pointer;
            color: var(--text-dim);
        }

        .CodeMirror-foldgutter-open:after {
            content: "\25BE";
        }

        .CodeMirror-foldgutter-folded:after {
            content: "\25B8";
        }

        .CodeMirror-foldgutter-open:hover,
        .CodeMirror-foldgutter-folded:hover {
            color: var(--text);
        }

        .CodeMirror-foldmarker {
            color: var(--text-muted);
            background: var(--surface-strong);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 0 5px;
            margin: 0 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
        }

        .CodeMirror-foldmarker:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }

        .cm-indent-guide {
            position: relative;
            border-left: 1px dotted rgba(255, 255, 255, 0.08);
        }

        @media (max-width: 480px) {
            body { padding: 24px 16px; }
            h1 { font-size: 20px; }
            .card { padding: 14px; }
        }

        /* Loading indicator */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--clay);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Editorial syntax palette — overrides material-darker for warm coherence */
        .CodeMirror.cm-s-material-darker .cm-keyword,
        .CodeMirror.cm-s-material-darker .cm-tag,
        .CodeMirror.cm-s-material-darker .cm-attribute { color: var(--clay) !important; }

        .CodeMirror.cm-s-material-darker .cm-property,
        .CodeMirror.cm-s-material-darker .cm-qualifier { color: var(--clay-soft) !important; }

        .CodeMirror.cm-s-material-darker .cm-atom,
        .CodeMirror.cm-s-material-darker .cm-builtin { color: var(--burgundy) !important; }

        .CodeMirror.cm-s-material-darker .cm-number { color: var(--warn) !important; }

        .CodeMirror.cm-s-material-darker .cm-string,
        .CodeMirror.cm-s-material-darker .cm-string-2 { color: var(--success) !important; }

        .CodeMirror.cm-s-material-darker .cm-comment {
            color: var(--text-dim) !important;
            font-style: italic;
        }

        .CodeMirror.cm-s-material-darker .cm-variable,
        .CodeMirror.cm-s-material-darker .cm-variable-2,
        .CodeMirror.cm-s-material-darker .cm-variable-3,
        .CodeMirror.cm-s-material-darker .cm-def { color: var(--text) !important; }

        .CodeMirror.cm-s-material-darker .cm-operator,
        .CodeMirror.cm-s-material-darker .cm-meta,
        .CodeMirror.cm-s-material-darker .cm-bracket,
        .CodeMirror.cm-s-material-darker .cm-punctuation { color: var(--text-muted) !important; }

        .CodeMirror.cm-s-material-darker .cm-header { color: var(--clay) !important; }
        .CodeMirror.cm-s-material-darker .cm-link { color: var(--info) !important; }

        .CodeMirror.cm-s-material-darker .cm-error {
            color: var(--danger) !important;
            background: rgba(248, 113, 113, 0.1);
        }

        /* Editorial system-level: text selection, scrollbar, keyboard focus */
        ::selection {
            background: rgba(213, 132, 76, 0.35);
            color: var(--text);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
            border: 2px solid var(--bg);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        :focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: 2px;
            border-radius: 3px;
        }

        button:focus-visible,
        a:focus-visible {
            outline-offset: 3px;
        }
    </style>
</head>
<body>
<div class="loading-overlay" id="loading"><div class="loading-spinner"></div></div>
<div class="container">
    <a class="back-link" href="index.html">← Back to Tools</a>
    <h1>Format Converter</h1>
    <p class="subtitle">Convert between JSON, YAML, and TOML formats</p>

    <div class="card">
        <div class="card-header">
            <label>Input <span id="detected-format" class="format-badge"></span></label>
            <button class="btn-clear-small" onclick="clearAll()">Clear</button>
        </div>
        <div id="editor-wrapper">
            <textarea id="input" hidden></textarea>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div style="display: flex; align-items: center;">
                <label>Output</label>
                <span class="format-buttons">
                    <button class="format-btn" data-format="json" onclick="setOutputFormat('json')">JSON</button>
                    <button class="format-btn" data-format="yaml" onclick="setOutputFormat('yaml')">YAML</button>
                    <button class="format-btn" data-format="toml" onclick="setOutputFormat('toml')">TOML</button>
                </span>
            </div>
            <button class="btn-copy-small" onclick="copyOutput()">Copy</button>
        </div>
        <div id="output-wrapper">
            <textarea id="output" hidden></textarea>
        </div>
    </div>
</div>
<div class="message" id="message" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js" integrity="sha384-CtBuRlcKITyrd+aBeTPNFB1/T8+kvtNQiWMCLtiGvD6NpLOJAdt8e8PpJJ2Gn1D0" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js" integrity="sha384-mNZ6k35sVNu7sE23KjWGt9HV//tFtxOxxBee7FzGSe32oiIpEd2jtDYWLJyciRSy" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/yaml/yaml.min.js" integrity="sha384-HRBFuRK5pnT+zuVLgmFtik3vkTVj3S73thA1O2D6YKrrUrx1jNd+g3smGmpkP09E" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/toml/toml.min.js" integrity="sha384-qtXCMqumgaJzeF9T2pkMi1WdtfUNwtjmB7uUqIo+gL2S09OURLHzsxrENEHbUAEN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js" integrity="sha384-Q1bXASnJgEhS8C0bKSZQRYmnyQjuG47fXyPqdh1c4iUD9giCdSmXiS6hAb00VnK3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js" integrity="sha384-syGEV/F5UdVbpIEMH5owBa1U3KtVa4kcBzsDb3YevB5oEe69JWVdV/4SLV8OPA9v" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldcode.min.js" integrity="sha384-56DCLCCmHdGJ9LfCjCosX9V7BkvD+6XnSW7R/7FpLdDDN7htHsH29z32V6K9DvAr" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/foldgutter.min.js" integrity="sha384-Ujh+/i1FRRKmFnt1FqIV3fTPf0X4x5IK9WmjETGXlg2xW4pDVh/kTpi3HVls0eIS" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/brace-fold.min.js" integrity="sha384-IjQ+wscX01sAidaR7mIjtuIZ9GbCI6zWLUcqhLp0e0jsdfPjHRYPNk8WlaWyrAHm" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/fold/indent-fold.min.js" integrity="sha384-m2kLouJQDMZYN1qdAwNjZx4K+zMnOZjseeZvfBzgHsntTXg/DFfnYGPefvJg58af" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror-addon-indent-guide@1.0.1/dist/indent-guide.js" integrity="sha384-WQnn3ars0BsnVG53aiVvSouFkv+o1KWS94HhGWo13oWF2I2pBBBpKdR1iKeGYVDn" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js" integrity="sha384-+pxiN6T7yvpryuJmE1gM9PX7yQit15auDb+ZwwvJOd/4be2Cie5/IuVXgQb/S9du" crossorigin="anonymous"></script>

<script type="module">
    // Load TOML library asynchronously
    let TOML = null;
    const tomlReady = import('https://cdn.jsdelivr.net/npm/smol-toml@1.3.1/+esm').then(m => {
        TOML = m.default;
    }).catch(err => {
        console.warn('TOML library failed to load:', err);
    });

    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const messageEl = document.getElementById('message');
    const formatBadge = document.getElementById('detected-format');
    
    let inputFormat = 'json';
    let outputFormat = null;

    const modeMap = {
        json: 'application/json',
        yaml: 'yaml',
        toml: 'toml'
    };

    const baseConfig = {
        theme: "material-darker",
        lineNumbers: true,
        lineWrapping: true,
        viewportMargin: Infinity,  // 配合 height:auto 使用，渲染所有行
        maxHighlightLength: Infinity,  // 禁用高亮长度限制
        matchBrackets: true,
        autoCloseBrackets: true,
        indentUnit: 2,
        tabSize: 2,
        indentGuide: true,
        foldGutter: {
            rangeFinder: CodeMirror.fold.auto
        },
        gutters: ["CodeMirror-linenumbers", "CodeMirror-foldgutter"],
        extraKeys: {
            "Ctrl-Q": function(cm) { cm.foldCode(cm.getCursor()); }
        }
    };

    const editor = CodeMirror.fromTextArea(inputEl, {
        ...baseConfig,
        mode: modeMap[inputFormat]
    });

    const editorOutput = CodeMirror.fromTextArea(outputEl, {
        ...baseConfig,
        mode: null,
        readOnly: true
    });

    // Hide loading overlay and refresh editors
    requestAnimationFrame(() => {
        editor.refresh();
        editorOutput.refresh();
        document.getElementById('loading').classList.add('hidden');
    });

    function detectFormat(text) {
        text = text.trim();
        if (!text) return null;

        // 1. JSON (strictest) - must start with { or [
        if (text.startsWith('{') || text.startsWith('[')) {
            try {
                const result = JSON.parse(text);
                if (typeof result === 'object' && result !== null) {
                    return 'json';
                }
            } catch (e) {}
        }

        // 2. TOML (stricter than YAML) - only if library is loaded
        if (TOML) {
            try {
                const result = TOML.parse(text);
                if (typeof result === 'object' && Object.keys(result).length > 0) {
                    return 'toml';
                }
            } catch (e) {}
        }

        // 3. YAML (most lenient, fallback)
        try {
            const result = jsyaml.load(text);
            if (typeof result === 'object' && result !== null) {
                return 'yaml';
            }
        } catch (e) {}

        return null;
    }

    let debounceTimeout;

    function debouncedDetectAndConvert(immediate = false) {
        const text = editor.getValue();

        clearTimeout(debounceTimeout);

        if (immediate) {
            // Immediate detection for paste events
            const detected = detectFormat(text);
            if (detected) {
                window.setInputFormat(detected);
            }
            // Only convert if output format is selected
            if (outputFormat && text.trim()) {
                window.convert();
            }
        } else {
            // Debounced detection
            debounceTimeout = setTimeout(() => {
                const detected = detectFormat(text);
                if (detected) {
                    window.setInputFormat(detected);
                }
                // Only convert if output format is selected
                if (outputFormat && text.trim()) {
                    window.convert();
                }
            }, 400);
        }
    }

    editor.on('change', function(cm, change) {
        // Detect immediately on paste, debounce on typing
        const isPaste = change.origin === 'paste';
        debouncedDetectAndConvert(isPaste);
    });

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = 'message ' + type;
        clearTimeout(showMessage._t);
        showMessage._t = setTimeout(() => {
            messageEl.className = 'message';
        }, 3000);
    }

    window.setInputFormat = function(format) {
        inputFormat = format;
        editor.setOption('mode', modeMap[format]);
        formatBadge.textContent = format.toUpperCase();
    }

    window.setOutputFormat = function(format) {
        outputFormat = format;
        editorOutput.setOption('mode', modeMap[format]);
        updateFormatButtons();

        if (editor.getValue().trim()) {
            window.convert();
        } else {
            editorOutput.setValue('');
        }
    }

    function updateFormatButtons() {
        document.querySelectorAll('.format-buttons .format-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.format === outputFormat);
        });
    }

    function parseInput(text, format) {
        switch (format) {
            case 'json':
                return JSON.parse(text);
            case 'yaml':
                return jsyaml.load(text);
            case 'toml':
                if (!TOML) throw new Error('TOML library is still loading, please try again');
                return TOML.parse(text);
            default:
                throw new Error('Unknown input format');
        }
    }

    function stringify(data, format) {
        switch (format) {
            case 'json':
                return JSON.stringify(data, null, 2);
            case 'yaml':
                return jsyaml.dump(data, { indent: 2, lineWidth: -1 });
            case 'toml':
                return stringifyToml(data);
            default:
                throw new Error('Unknown output format');
        }
    }

    function stringifyToml(data) {
        if (!TOML) {
            throw new Error('TOML library is still loading, please try again');
        }
        // TOML requires root to be an object/table
        if (Array.isArray(data)) {
            throw new Error('TOML does not support arrays at root level. Wrap in an object like { "items": [...] }');
        }
        if (data === null || typeof data !== 'object') {
            throw new Error('TOML requires an object/table at root level');
        }
        try {
            return TOML.stringify(data);
        } catch (e) {
            // Provide friendlier error messages for common TOML limitations
            const msg = e.message || '';
            if (msg.includes('mixed') || msg.includes('heterogeneous')) {
                throw new Error('TOML arrays must contain values of the same type');
            }
            if (msg.includes('null') || msg.includes('undefined')) {
                throw new Error('TOML does not support null values');
            }
            throw e;
        }
    }

    window.convert = function() {
        if (!outputFormat) {
            showMessage('Please select an output format', 'error');
            return;
        }
        const text = editor.getValue().trim();
        if (!text) {
            showMessage('Please enter content to convert', 'error');
            return;
        }

        let data;
        try {
            data = parseInput(text, inputFormat);
        } catch (e) {
            showMessage(`Invalid ${inputFormat.toUpperCase()}: ${e.message}`, 'error');
            return;
        }

        try {
            const result = stringify(data, outputFormat);
            editorOutput.setValue(result);
            showMessage(`Converted from ${inputFormat.toUpperCase()} to ${outputFormat.toUpperCase()}`, 'success');
        } catch (e) {
            showMessage(`Cannot convert to ${outputFormat.toUpperCase()}: ${e.message}`, 'error');
        }
    }

    window.copyOutput = function() {
        const result = editorOutput.getValue();
        if (!result) {
            showMessage('Nothing to copy', 'error');
            return;
        }
        navigator.clipboard.writeText(result).then(() => {
            showMessage('Copied to clipboard', 'success');
        }).catch(() => {
            showMessage('Failed to copy', 'error');
        });
    }

    window.clearAll = function() {
        clearTimeout(debounceTimeout);
        editor.setValue('');
        editor.clearHistory();
        editorOutput.setValue('');
        editorOutput.clearHistory();
        editorOutput.setOption('mode', null);
        formatBadge.textContent = '';
        inputFormat = 'json';
        outputFormat = null;
        editor.setOption('mode', modeMap['json']);
        // Clear active state from output format buttons
        document.querySelectorAll('.format-buttons .format-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        showMessage('Cleared', 'success');
    }
</script>
</body>
</html>
