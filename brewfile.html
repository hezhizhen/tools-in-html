<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://formulae.brew.sh; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Brewfile Analyzer</title>
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js" as="script" integrity="sha384-H3uzGzTfGHUAumB8+s4GEdfFwzAceN9wCCndN8AXubWKFIPuBSWKKtWDx7RhSf/z" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js" integrity="sha384-H3uzGzTfGHUAumB8+s4GEdfFwzAceN9wCCndN8AXubWKFIPuBSWKKtWDx7RhSf/z" crossorigin="anonymous"></script>
    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" integrity="sha384-phfEUVAmRZV1Pzn/Xgxc3NH6zPMDuer0wHU9jRQKhNBBLyV4MP1gaBY1sxfxxPRT" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/material-darker.css" integrity="sha384-8Q4oVdkXS0g8qSdedXknw9E+LAgELnjtGG0XlqLny8xVH61TblZLEd1gc0ka8xQs" crossorigin="anonymous">
    <style>
        :root {
            --bg: #1C1916;
            --surface: #25211C;
            --surface-strong: #2E2924;
            --border: #3A332B;
            --border-hover: #5A4D3D;
            --text: #EFE6D5;
            --text-muted: #A39A8C;
            --text-dim: #6E6358;
            --clay: #D4844C;
            --clay-soft: #E5A77A;
            --clay-deep: #8B4A28;
            --burgundy: #A85B3C;
            --danger: #F87171;
            --warn: #F59E0B;
            --success: #4ADE80;
            --info: #93C5FD;
            --radius: 8px;
            --transition: 150ms ease-out;
            --serif: 'Iowan Old Style', 'Charter', 'Bookerly', Georgia, serif;
            --sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { color-scheme: dark; }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background: var(--bg);
            min-height: 100vh;
            padding: 48px 24px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--serif);
            font-size: 26px;
            font-weight: 400;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-family: var(--serif);
            font-style: italic;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: var(--text);
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            color: var(--text);
            font-size: 14px;
        }

        /* CodeMirror */
        .CodeMirror {
            background: rgba(0, 0, 0, 0.3) !important;
            height: auto;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.55;
            transition: border-color var(--transition);
        }

        .CodeMirror-focused {
            border-color: var(--border-hover) !important;
        }

        .CodeMirror-gutters {
            background: rgba(0, 0, 0, 0.2) !important;
            border-right: 1px solid var(--border) !important;
        }

        .CodeMirror-linenumber {
            color: var(--text-dim) !important;
            padding: 0 8px 0 3px !important;
            min-width: 2em;
            text-align: right;
        }

        .CodeMirror-lines { padding: 12px 0; }

        .CodeMirror-selected {
            background: rgba(255, 255, 255, 0.08) !important;
        }

        .CodeMirror-cursor {
            border-left: 1px solid var(--clay) !important;
        }

        .cm-indent-guide {
            position: relative;
            border-left: 1px dotted rgba(255, 255, 255, 0.08);
        }

        .CodeMirror-matchingbracket {
            color: var(--text) !important;
            background: rgba(255, 255, 255, 0.12) !important;
            font-weight: 600;
            border-radius: 2px;
        }

        .CodeMirror-nonmatchingbracket {
            color: var(--danger) !important;
            background: rgba(248, 113, 113, 0.15) !important;
            border-radius: 2px;
        }

        .drop-zone {
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 12px;
            text-align: center;
            cursor: pointer;
            transition: border-color var(--transition), background var(--transition);
            background: rgba(0, 0, 0, 0.2);
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--border-hover);
            background: var(--surface-strong);
        }

        .drop-zone-text svg {
            color: var(--text-dim);
            margin-bottom: 8px;
            width: 32px;
            height: 32px;
        }

        .drop-zone-text p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .drop-zone-hint {
            color: var(--text-dim);
            font-size: 12px;
        }

        .drop-zone.has-file {
            border-color: rgba(74, 222, 128, 0.3);
            border-style: solid;
        }

        .drop-zone.has-file .drop-zone-text p::before {
            content: "\2713 ";
            color: var(--success);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin: 12px 0 0;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }

        button:hover {
            background: var(--surface-strong);
            border-color: var(--border-hover);
        }

        .btn-analyze {
            background: var(--clay);
            color: var(--bg);
            border-color: var(--clay);
            min-width: 120px;
        }

        .btn-analyze:hover {
            background: var(--clay-soft);
            border-color: var(--clay-soft);
        }

        .btn-clear:hover {
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.3);
        }

        .result-section { display: none; }
        .result-section.show { display: block; }

        .stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: var(--radius);
            flex: 1;
            min-width: 130px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 500;
            color: var(--text);
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .section-title {
            font-family: var(--serif);
            font-style: italic;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 14px;
            color: var(--text);
            padding-left: 10px;
            border-left: 2px solid var(--clay);
        }

        #graph-container {
            height: 500px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            text-align: left;
            padding: 10px 14px;
            background: var(--surface-strong);
            color: var(--text-muted);
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
        }

        td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text-muted);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .formula-name {
            font-weight: 500;
            color: var(--text);
        }

        .formula-name.is-dependency {
            color: var(--text-muted);
            font-weight: 400;
        }

        .version-tag {
            display: inline-block;
            background: rgba(74, 222, 128, 0.08);
            color: var(--success);
            border: 1px solid rgba(74, 222, 128, 0.2);
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-family: var(--mono);
        }

        .license-tag {
            display: inline-block;
            background: var(--surface-strong);
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 11px;
        }

        .homepage-link {
            color: var(--info);
            text-decoration: none;
            display: block;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .homepage-link:hover {
            text-decoration: underline;
        }

        .deps-list {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }

        .dep-tag {
            background: var(--surface-strong);
            border: 1px solid var(--border);
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--mono);
        }

        .loading {
            text-align: center;
            padding: 32px;
            color: var(--text-muted);
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--clay);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 12px;
            color: var(--text-dim);
            font-size: 13px;
        }

        .message {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 8px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 13px;
            display: none;
            z-index: 1000;
        }

        .message.success {
            display: block;
            color: var(--success);
            border-color: rgba(74, 222, 128, 0.3);
        }

        .message.error {
            display: block;
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.3);
        }

        .tabs {
            display: inline-flex;
            gap: 0;
            padding: 2px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 14px;
        }

        .tab-btn {
            padding: 5px 12px;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
            min-width: auto;
        }

        .tab-btn.active {
            background: var(--surface-strong);
            color: var(--clay-soft);
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            body { padding: 24px 16px; }
            h1 { font-size: 20px; }
            .card { padding: 14px; }
            #graph-container { height: 350px; }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .modal-title {
            font-family: var(--serif);
            font-style: italic;
            font-size: 16px;
            font-weight: 400;
            color: var(--text);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
            transition: color var(--transition);
        }

        .modal-close:hover {
            color: var(--text);
        }

        .dep-tree {
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.6;
        }

        .dep-tree ul {
            list-style: none;
            padding-left: 18px;
            margin: 0;
        }

        .dep-tree > ul {
            padding-left: 0;
        }

        .dep-tree li {
            position: relative;
            color: var(--text-muted);
        }

        .dep-tree li::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 0;
            height: 100%;
            border-left: 1px solid var(--border-hover);
        }

        .dep-tree li::after {
            content: '';
            position: absolute;
            left: -14px;
            top: 0.7em;
            width: 10px;
            border-bottom: 1px solid var(--border-hover);
        }

        .dep-tree li:last-child::before {
            height: 0.7em;
        }

        .dep-tree > ul > li::before,
        .dep-tree > ul > li::after {
            display: none;
        }

        .dep-tree .node-name {
            padding: 1px 6px;
            border-radius: 3px;
            display: inline-block;
        }

        .dep-tree .node-root {
            background: var(--clay);
            color: var(--bg);
            font-weight: 500;
        }

        .dep-tree .node-dep {
            background: var(--surface-strong);
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .dep-tree .node-build {
            background: rgba(213, 132, 76, 0.10);
            color: var(--clay-soft);
            border: 1px solid rgba(213, 132, 76, 0.25);
        }

        .formula-name.clickable {
            cursor: pointer;
            transition: color var(--transition);
        }

        .formula-name.clickable:hover {
            text-decoration: underline;
        }

        /* Editorial syntax palette — overrides material-darker for warm coherence */
        .CodeMirror.cm-s-material-darker .cm-keyword,
        .CodeMirror.cm-s-material-darker .cm-tag,
        .CodeMirror.cm-s-material-darker .cm-attribute { color: var(--clay) !important; }

        .CodeMirror.cm-s-material-darker .cm-property,
        .CodeMirror.cm-s-material-darker .cm-qualifier { color: var(--clay-soft) !important; }

        .CodeMirror.cm-s-material-darker .cm-atom,
        .CodeMirror.cm-s-material-darker .cm-builtin { color: var(--burgundy) !important; }

        .CodeMirror.cm-s-material-darker .cm-number { color: var(--warn) !important; }

        .CodeMirror.cm-s-material-darker .cm-string,
        .CodeMirror.cm-s-material-darker .cm-string-2 { color: var(--success) !important; }

        .CodeMirror.cm-s-material-darker .cm-comment {
            color: var(--text-dim) !important;
            font-style: italic;
        }

        .CodeMirror.cm-s-material-darker .cm-variable,
        .CodeMirror.cm-s-material-darker .cm-variable-2,
        .CodeMirror.cm-s-material-darker .cm-variable-3,
        .CodeMirror.cm-s-material-darker .cm-def { color: var(--text) !important; }

        .CodeMirror.cm-s-material-darker .cm-operator,
        .CodeMirror.cm-s-material-darker .cm-meta,
        .CodeMirror.cm-s-material-darker .cm-bracket,
        .CodeMirror.cm-s-material-darker .cm-punctuation { color: var(--text-muted) !important; }

        .CodeMirror.cm-s-material-darker .cm-header { color: var(--clay) !important; }
        .CodeMirror.cm-s-material-darker .cm-link { color: var(--info) !important; }

        .CodeMirror.cm-s-material-darker .cm-error {
            color: var(--danger) !important;
            background: rgba(248, 113, 113, 0.1);
        }

        /* Editorial system-level: text selection, scrollbar, keyboard focus */
        ::selection {
            background: rgba(213, 132, 76, 0.35);
            color: var(--text);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
            border: 2px solid var(--bg);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        :focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: 2px;
            border-radius: 3px;
        }

        button:focus-visible,
        a:focus-visible {
            outline-offset: 3px;
        }
    </style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">&larr; Back to Tools</a>
    <h1>Brewfile Analyzer</h1>
    <p class="subtitle">Analyze Homebrew formulas, versions, and dependencies</p>

    <div class="card">
        <label>Upload or Paste Brewfile</label>
        <div class="drop-zone" id="dropZone">
            <div class="drop-zone-text">
                <svg fill="none" height="48" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="48">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" x2="12" y1="3" y2="15"></line>
                </svg>
                <p>Drop Brewfile here or click to upload</p>
                <span class="drop-zone-hint">or paste content below</span>
            </div>
            <input accept="Brewfile,Brewfile.*,*.txt" id="fileInput" style="display: none;" type="file">
        </div>
        <div id="editor-wrapper">
            <textarea id="input" hidden></textarea>
        </div>

        <div class="button-group">
            <button class="btn-analyze" onclick="analyze()">Analyze</button>
            <button class="btn-clear" onclick="clearAll()">Clear</button>
        </div>
    </div>

    <div class="loading" id="loading" style="display: none;">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Fetching formula information...</div>
    </div>

    <div class="result-section" id="result">
        <div class="card">
            <div class="stats" id="stats"></div>
        </div>

        <div class="card">
            <div class="section-title">Dependency Graph</div>
            <div id="graph-container"></div>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('all')">All Formulas</button>
                <button class="tab-btn" onclick="showTab('brewfile')">From Brewfile Only</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Version</th>
                        <th>Description</th>
                        <th>License</th>
                        <th>Homepage</th>
                        <th>Dependencies</th>
                    </tr>
                    </thead>
                    <tbody id="formulaTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="message" id="message" aria-live="polite"></div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">Dependency Tree</span>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="dep-tree" id="depTreeContent"></div>
    </div>
</div>

<!-- CodeMirror JS -->
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js" integrity="sha384-CtBuRlcKITyrd+aBeTPNFB1/T8+kvtNQiWMCLtiGvD6NpLOJAdt8e8PpJJ2Gn1D0" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/ruby/ruby.min.js" integrity="sha384-XLb7edCQ6x2WMEHlmXw5f/W4ZGpGZYMQwt7ZPcOn761OtiIGCC+bRtDzdqqHexOk" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/matchbrackets.min.js" integrity="sha384-Q1bXASnJgEhS8C0bKSZQRYmnyQjuG47fXyPqdh1c4iUD9giCdSmXiS6hAb00VnK3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/addon/edit/closebrackets.min.js" integrity="sha384-syGEV/F5UdVbpIEMH5owBa1U3KtVa4kcBzsDb3YevB5oEe69JWVdV/4SLV8OPA9v" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror-addon-indent-guide@1.0.1/dist/indent-guide.js" integrity="sha384-WQnn3ars0BsnVG53aiVvSouFkv+o1KWS94HhGWo13oWF2I2pBBBpKdR1iKeGYVDn" crossorigin="anonymous"></script>

<script>
    const inputEl = document.getElementById('input');
    const resultEl = document.getElementById('result');
    const loadingEl = document.getElementById('loading');
    const loadingTextEl = document.getElementById('loadingText');
    const messageEl = document.getElementById('message');
    const statsEl = document.getElementById('stats');
    const formulaTableEl = document.getElementById('formulaTable');
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    let allFormulas = [];
    let failedFormulas = [];

    // CodeMirror 配置
    const codeMirrorConfig = {
        mode: "text/x-ruby",
        theme: "material-darker",
        lineNumbers: true,
        lineWrapping: true,
        viewportMargin: Infinity,  // 配合 height:auto 使用，渲染所有行
        matchBrackets: true,
        autoCloseBrackets: true,
        indentUnit: 2,
        tabSize: 2,
        indentGuide: true,
        gutters: ["CodeMirror-linenumbers"]
    };

    // 初始化 CodeMirror 编辑器
    const editor = CodeMirror.fromTextArea(inputEl, codeMirrorConfig);

    // 初始化：刷新编辑器
    setTimeout(() => editor.refresh(), 100);

    // File upload handling
    dropZone.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFile(e.target.files[0]);
        }
    });

    // Drag and drop
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    function handleFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            editor.setValue(e.target.result);
            editor.refresh();
            dropZone.classList.add('has-file');
            dropZone.querySelector('.drop-zone-text p').textContent = file.name;
            showMessage(`Loaded ${file.name}`, 'success');
        };
        reader.onerror = () => {
            showMessage('Error reading file', 'error');
        };
        reader.readAsText(file);
    }

    let brewfileFormulas = [];
    let currentTab = 'all';
    let cy = null;
    let analyzeToken = null;

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = 'message ' + type;
        clearTimeout(showMessage._t);
        showMessage._t = setTimeout(() => {
            messageEl.className = 'message';
        }, 3000);
    }

    function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        const s = String(str);
        return s.replace(/[&<>"']/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[c]));
    }

    function parseBrewfile(content) {
        const formulas = [];
        const lines = content.split('\n');
        for (const line of lines) {
            // Match: brew "formula" or brew 'formula'
            const match = line.match(/^\s*brew\s+["']([^"']+)["']/);
            if (match) {
                formulas.push(match[1]);
            }
        }
        return formulas;
    }

    async function fetchFormulaInfo(name) {
        try {
            const res = await fetch(`https://formulae.brew.sh/api/formula/${name}.json`);
            if (!res.ok) {
                return {error: true, name, reason: `HTTP ${res.status}`};
            }
            return await res.json();
        } catch (e) {
            return {error: true, name, reason: e.message || 'Network error'};
        }
    }

    async function analyze() {
        const content = editor.getValue().trim();
        if (!content) {
            showMessage('Please enter a Brewfile', 'error');
            return;
        }

        const formulas = parseBrewfile(content);
        if (formulas.length === 0) {
            showMessage('No formulas found in Brewfile', 'error');
            return;
        }

        // Cancel any previous analyze, start fresh token.
        if (analyzeToken) analyzeToken.cancelled = true;
        const token = { cancelled: false };
        analyzeToken = token;

        loadingEl.style.display = 'block';
        resultEl.classList.remove('show');

        try {
            failedFormulas = [];
            const brewfileSet = new Set(formulas);
            const fetched = new Map(); // name -> formula info (cache)
            const queue = [...formulas]; // formulas to fetch
            const queued = new Set(formulas); // track queued to avoid duplicates
            let fetchCount = 0;

            // Recursively fetch all dependencies
            while (queue.length > 0) {
                if (token.cancelled) return;

                const name = queue.shift();
                queued.delete(name);

                // Skip if already fetched
                if (fetched.has(name)) continue;

                fetchCount++;
                loadingTextEl.textContent = `Fetching ${fetchCount}: ${name}...`;

                const info = await fetchFormulaInfo(name);
                if (token.cancelled) return;

                fetched.set(name, info);

                // If successful, add dependencies to queue
                if (!info.error) {
                    const deps = [
                        ...(info.dependencies || []),
                        ...(info.build_dependencies || [])
                    ];
                    for (const dep of deps) {
                        if (!fetched.has(dep) && !queued.has(dep)) {
                            queue.push(dep);
                            queued.add(dep);
                        }
                    }
                }

                // Small delay to avoid overwhelming the API
                if (queue.length > 0) {
                    await new Promise(r => setTimeout(r, 50));
                    if (token.cancelled) return;
                }
            }

            // Separate successful and failed results
            const allResults = Array.from(fetched.values());
            brewfileFormulas = allResults.filter(r => !r.error && brewfileSet.has(r.name));
            failedFormulas = allResults.filter(r => r.error);
            allFormulas = allResults.filter(r => !r.error);

            if (brewfileFormulas.length === 0) {
                showMessage('No valid formulas found', 'error');
                loadingEl.style.display = 'none';
                return;
            }

            renderStats();
            renderGraph();
            renderTable();

            resultEl.classList.add('show');
            showMessage(`Analyzed ${allFormulas.length} formulas`, 'success');

        } catch (e) {
            if (token.cancelled) return;
            showMessage('Error: ' + e.message, 'error');
        } finally {
            if (!token.cancelled) {
                loadingEl.style.display = 'none';
            }
        }
    }

    function renderStats() {
        const brewfileSet = new Set(brewfileFormulas.map(f => f.name));
        const depCount = allFormulas.filter(f => !brewfileSet.has(f.name)).length;

        let failedHtml = '';
        if (failedFormulas.length > 0) {
            failedHtml = `
                <div class="stat-item" style="flex-basis:100%;background:rgba(239,68,68,0.1);">
                    <div class="stat-value" style="color:var(--danger);">${failedFormulas.length} Failed</div>
                    <div class="stat-label" style="color:var(--danger);">
                        ${failedFormulas.map(f => `<span class="dep-tag" style="background:rgba(248,113,113,0.15);color:var(--danger);margin:2px;" title="${escapeHtml(f.reason)}">${escapeHtml(f.name)}</span>`).join('')}
                    </div>
                </div>`;
        }

        statsEl.innerHTML = `
                <div class="stat-item">
                    <div class="stat-value">${allFormulas.length}</div>
                    <div class="stat-label">Total Formulas</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${brewfileFormulas.length}</div>
                    <div class="stat-label">In Brewfile</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">${depCount}</div>
                    <div class="stat-label">Dependencies</div>
                </div>
                ${failedHtml}
            `;
    }

    function renderGraph() {
        const brewfileSet = new Set(brewfileFormulas.map(f => f.name));
        const allFormulaNames = new Set(allFormulas.map(f => f.name));
        const elements = [];

        for (const formula of allFormulas) {
            const isFromBrewfile = brewfileSet.has(formula.name);
            elements.push({
                data: {
                    id: formula.name,
                    label: formula.name,
                    isFromBrewfile: isFromBrewfile,
                    tooltip: `${formula.name} ${formula.versions?.stable || ''}\n${formula.desc || ''}`
                }
            });

            const deps = [
                ...(formula.dependencies || []),
                ...(formula.build_dependencies || [])
            ];
            for (const dep of deps) {
                // Only create edge if target node exists
                if (allFormulaNames.has(dep)) {
                    elements.push({
                        data: {
                            id: `${formula.name}->${dep}`,
                            source: formula.name,
                            target: dep,
                            isBuildDep: formula.build_dependencies?.includes(dep)
                        }
                    });
                }
            }
        }

        const container = document.getElementById('graph-container');

        if (cy) {
            cy.destroy();
        }

        cy = cytoscape({
            container: container,
            elements: elements,
            style: [
                {
                    selector: 'node',
                    style: {
                        'background-color': '#3A332B',
                        'background-opacity': 0.95,
                        'border-color': '#5A4D3D',
                        'border-width': 1,
                        'label': 'data(label)',
                        'color': '#EFE6D5',
                        'text-valign': 'center',
                        'text-halign': 'center',
                        'font-family': '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
                        'font-size': '11px',
                        'text-wrap': 'wrap',
                        'text-max-width': '100px',
                        'width': 'label',
                        'height': 'label',
                        'padding': '8px',
                        'shape': 'round-rectangle',
                        'text-outline-color': '#1C1916',
                        'text-outline-width': 0.5
                    }
                },
                {
                    selector: 'node[?isFromBrewfile]',
                    style: {
                        'background-color': '#D4844C',
                        'background-opacity': 1,
                        'border-color': '#E5A77A',
                        'border-width': 2,
                        'color': '#1C1916',
                        'font-size': '12px',
                        'font-weight': 'bold',
                        'text-outline-color': '#8B4A28',
                        'text-outline-width': 0.5
                    }
                },
                {
                    selector: 'edge',
                    style: {
                        'width': 1.5,
                        'line-color': '#5A4D3D',
                        'line-opacity': 0.5,
                        'target-arrow-color': '#6E6358',
                        'target-arrow-shape': 'triangle',
                        'arrow-scale': 0.7,
                        'curve-style': 'bezier'
                    }
                },
                {
                    selector: 'edge[?isBuildDep]',
                    style: {
                        'line-style': 'dashed',
                        'line-dash-pattern': [5, 3],
                        'line-opacity': 0.35
                    }
                },
                {
                    selector: 'node:selected',
                    style: {
                        'border-color': '#F59E0B',
                        'border-width': 3,
                        'background-color': '#F59E0B'
                    }
                },
                {
                    selector: 'edge:selected',
                    style: {
                        'line-color': '#F59E0B',
                        'line-opacity': 1,
                        'target-arrow-color': '#F59E0B',
                        'width': 2
                    }
                },
                {
                    selector: 'node:active',
                    style: {
                        'overlay-opacity': 0.15,
                        'overlay-color': '#D4844C'
                    }
                }
            ],
            layout: {
                name: 'breadthfirst',
                directed: true,
                spacingFactor: 1.25,
                avoidOverlap: true,
                nodeDimensionsIncludeLabels: true
            },
            minZoom: 0.15,
            maxZoom: 3,
            wheelSensitivity: 0.3
        });

        // Fit graph to container after layout completes
        cy.on('layoutstop', () => {
            cy.fit(undefined, 50);
        });
        
        // Ensure fit is called even if layout completes before listener attached
        setTimeout(() => {
            cy.fit(undefined, 50);
        }, 500);
    }

    function renderTable() {
        const brewfileSet = new Set(brewfileFormulas.map(f => f.name));
        let html = '';

        for (const formula of allFormulas) {
            const isFromBrewfile = brewfileSet.has(formula.name);
            if (currentTab === 'brewfile' && !isFromBrewfile) continue;

            const deps = [
                ...(formula.dependencies || []),
                ...(formula.build_dependencies || [])
            ];

            html += `
                    <tr>
                        <td>
                            <span class="formula-name clickable ${isFromBrewfile ? '' : 'is-dependency'}" onclick="showDependencyTree('${escapeHtml(formula.name)}')">${escapeHtml(formula.name)}</span>
                            ${!isFromBrewfile ? '<span style="color:var(--text-dim);font-size:11px;margin-left:4px;">(dep)</span>' : ''}
                        </td>
                        <td><span class="version-tag">${escapeHtml(formula.versions?.stable || 'N/A')}</span></td>
                        <td style="color:var(--text-dim);max-width:300px;">${escapeHtml(formula.desc || '')}</td>
                        <td><span class="license-tag">${escapeHtml(Array.isArray(formula.license) ? formula.license.join(', ') : (formula.license || 'unknown'))}</span></td>
                        <td>${formula.homepage && /^https?:\/\//i.test(formula.homepage) ? `<a href="${escapeHtml(formula.homepage)}" target="_blank" rel="noopener noreferrer" class="homepage-link">${escapeHtml(formula.homepage)}</a>` : escapeHtml(formula.homepage || '')}</td>
                        <td>
                            <div class="deps-list">
                                ${deps.map(d => `<span class="dep-tag">${escapeHtml(d)}</span>`).join('')}
                            </div>
                        </td>
                    </tr>
                `;
        }

        formulaTableEl.innerHTML = html || '<tr><td colspan="6" style="text-align:center;color:var(--text-dim);">No formulas found</td></tr>';
    }

    function showTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent.toLowerCase().includes(tab === 'all' ? 'all' : 'brewfile'));
        });
        renderTable();
    }

    function clearAll() {
        if (analyzeToken) {
            analyzeToken.cancelled = true;
            analyzeToken = null;
        }
        loadingEl.style.display = 'none';
        editor.setValue('');
        editor.clearHistory();
        editor.refresh();
        resultEl.classList.remove('show');
        allFormulas = [];
        brewfileFormulas = [];
        failedFormulas = [];
        dropZone.classList.remove('has-file');
        dropZone.querySelector('.drop-zone-text p').textContent = 'Drop Brewfile here or click to upload';
        fileInput.value = '';
        if (cy) {
            cy.destroy();
            cy = null;
        }
        showMessage('Cleared', 'success');
    }

    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const depTreeContent = document.getElementById('depTreeContent');

    function showDependencyTree(name) {
        const formulaMap = new Map(allFormulas.map(f => [f.name, f]));
        const formula = formulaMap.get(name);
        if (!formula) return;

        modalTitle.textContent = `${name} - Dependency Tree`;

        function buildTree(formulaName, visited = new Set()) {
            if (visited.has(formulaName)) {
                return `<li><span class="node-name node-dep">${escapeHtml(formulaName)}</span> <span style="color:var(--text-dim);font-size:11px;">(circular)</span></li>`;
            }
            visited.add(formulaName);

            const f = formulaMap.get(formulaName);
            if (!f) {
                return `<li><span class="node-name node-dep">${escapeHtml(formulaName)}</span> <span style="color:var(--text-dim);font-size:11px;">(not found)</span></li>`;
            }

            const deps = f.dependencies || [];
            const buildDeps = f.build_dependencies || [];
            const isRoot = formulaName === name;

            let html = `<li><span class="node-name ${isRoot ? 'node-root' : 'node-dep'}">${escapeHtml(formulaName)}</span>`;

            if (deps.length > 0 || buildDeps.length > 0) {
                html += '<ul>';
                for (const dep of deps) {
                    html += buildTree(dep, new Set(visited));
                }
                for (const dep of buildDeps) {
                    if (!deps.includes(dep)) {
                        const f2 = formulaMap.get(dep);
                        const innerVisited = new Set(visited);
                        if (innerVisited.has(dep)) {
                            html += `<li><span class="node-name node-build">${escapeHtml(dep)}</span> <span style="color:var(--text-dim);font-size:11px;">(build, circular)</span></li>`;
                        } else if (!f2) {
                            html += `<li><span class="node-name node-build">${escapeHtml(dep)}</span> <span style="color:var(--text-dim);font-size:11px;">(build, not found)</span></li>`;
                        } else {
                            innerVisited.add(dep);
                            const innerDeps = [...(f2.dependencies || []), ...(f2.build_dependencies || [])];
                            if (innerDeps.length > 0) {
                                html += `<li><span class="node-name node-build">${escapeHtml(dep)}</span> <span style="color:var(--text-dim);font-size:11px;">(build)</span>`;
                                html += '<ul>';
                                for (const d of f2.dependencies || []) {
                                    html += buildTree(d, new Set(innerVisited));
                                }
                                for (const d of f2.build_dependencies || []) {
                                    if (!(f2.dependencies || []).includes(d)) {
                                        html += buildTree(d, new Set(innerVisited));
                                    }
                                }
                                html += '</ul></li>';
                            } else {
                                html += `<li><span class="node-name node-build">${escapeHtml(dep)}</span> <span style="color:var(--text-dim);font-size:11px;">(build)</span></li>`;
                            }
                        }
                    }
                }
                html += '</ul>';
            }

            html += '</li>';
            return html;
        }

        depTreeContent.innerHTML = '<ul>' + buildTree(name) + '</ul>';
        modalOverlay.classList.add('show');
    }

    function closeModal() {
        modalOverlay.classList.remove('show');
    }

    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
            closeModal();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeModal();
        }
    });
</script>
</body>
</html>
