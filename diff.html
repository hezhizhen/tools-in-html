<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Text Diff Tool</title>
    <style>
        :root {
            --bg: #1C1916;
            --surface: #25211C;
            --surface-strong: #2E2924;
            --border: #3A332B;
            --border-hover: #5A4D3D;
            --text: #EFE6D5;
            --text-muted: #A39A8C;
            --text-dim: #6E6358;
            --clay: #D4844C;
            --clay-soft: #E5A77A;
            --clay-deep: #8B4A28;
            --burgundy: #A85B3C;
            --danger: #F87171;
            --warn: #F59E0B;
            --success: #4ADE80;
            --info: #93C5FD;
            --radius: 8px;
            --transition: 150ms ease-out;
            --serif: 'Iowan Old Style', 'Charter', 'Bookerly', Georgia, serif;
            --sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background: var(--bg);
            min-height: 100vh;
            padding: 48px 24px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--serif);
            font-size: 26px;
            font-weight: 400;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-family: var(--serif);
            font-style: italic;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: var(--text);
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 12px;
        }

        .card-title {
            font-family: var(--serif);
            font-style: italic;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.2;
            margin-bottom: 14px;
            color: var(--text);
            padding-left: 10px;
            border-left: 2px solid var(--clay);
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .input-section label {
            display: block;
            margin-bottom: 8px;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            color: var(--text);
            font-size: 14px;
        }

        .editor-container {
            display: flex;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: border-color var(--transition);
        }

        .editor-container:focus-within {
            border-color: var(--border-hover);
        }

        .line-numbers {
            padding: 12px 0;
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-dim);
            font-size: 12px;
            font-family: var(--mono);
            line-height: 1.55;
            text-align: right;
            user-select: none;
            min-width: 40px;
            border-right: 1px solid var(--border);
        }

        .line-numbers div {
            padding: 0 8px;
        }

        textarea {
            flex: 1;
            min-height: 60px;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 12px;
            font-family: var(--mono);
            line-height: 1.55;
            resize: none;
            overflow: hidden;
        }

        textarea:focus {
            outline: none;
        }

        textarea::placeholder {
            color: var(--text-dim);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin: 16px 0 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }

        button:hover {
            background: var(--surface-strong);
            border-color: var(--border-hover);
        }

        .btn-compare {
            background: var(--clay);
            color: var(--bg);
            border-color: var(--clay);
            min-width: 120px;
        }

        .btn-compare:hover {
            background: var(--clay-soft);
            border-color: var(--clay-soft);
        }

        .btn-clear:hover {
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.3);
        }

        .result-section {
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .stats {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .stat-item.added {
            border-color: rgba(74, 222, 128, 0.25);
        }

        .stat-item.removed {
            border-color: rgba(248, 113, 113, 0.25);
        }

        .stat-value {
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .diff-output {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.6;
            max-height: 540px;
            overflow-y: auto;
        }

        .diff-line {
            padding: 1px 6px;
            border-radius: 3px;
            white-space: pre-wrap;
            word-break: break-all;
            display: flex;
            gap: 12px;
        }

        .line-num {
            min-width: 36px;
            color: var(--text-dim);
            text-align: right;
            user-select: none;
            flex-shrink: 0;
        }

        .diff-line.added {
            background: var(--added-bg);
            color: var(--added-fg);
        }

        .diff-line.removed {
            background: var(--removed-bg);
            color: var(--removed-fg);
        }

        .diff-line.unchanged {
            color: var(--text-muted);
        }

        .diff-line.header {
            background: rgba(165, 180, 252, 0.08);
            color: var(--info);
            font-weight: 500;
            margin-top: 10px;
        }

        .inline-diff {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }

        .char-diff-container {
            line-height: 1.8;
        }

        .char-line-num {
            display: inline-block;
            min-width: 36px;
            padding-right: 12px;
            color: var(--text-dim);
            text-align: right;
            user-select: none;
            font-size: 12px;
        }

        .char-added {
            background: rgba(74, 222, 128, 0.18);
            color: var(--added-fg);
            padding: 0 2px;
            border-radius: 2px;
        }

        .char-removed {
            background: rgba(248, 113, 113, 0.18);
            color: var(--removed-fg);
            padding: 0 2px;
            border-radius: 2px;
            text-decoration: line-through;
        }

        .char-newline {
            font-size: 11px;
            opacity: 0.8;
            text-decoration: none;
        }

        .char-space, .char-tab {
            opacity: 0.6;
            font-size: 11px;
        }

        .mode-toggle {
            display: inline-flex;
            gap: 0;
            margin-bottom: 14px;
            padding: 2px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .mode-btn {
            padding: 5px 12px;
            background: transparent;
            border: none;
            border-radius: 4px;
            color: var(--text-dim);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background var(--transition), color var(--transition);
        }

        .mode-btn.active {
            background: var(--surface-strong);
            color: var(--clay-soft);
        }

        .mode-btn:hover:not(.active) {
            color: var(--text-muted);
        }

        .identical-message {
            text-align: center;
            padding: 32px;
            color: var(--success);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            body {
                padding: 24px 16px;
            }

            .input-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 20px;
            }

            .card {
                padding: 16px;
            }

            .stats {
                flex-direction: column;
            }
        }

        /* Editorial system-level: text selection, scrollbar, keyboard focus */
        ::selection {
            background: rgba(213, 132, 76, 0.35);
            color: var(--text);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
            border: 2px solid var(--bg);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        :focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: 2px;
            border-radius: 3px;
        }

        button:focus-visible,
        a:focus-visible {
            outline-offset: 3px;
        }
    </style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← Back to Tools</a>
    <h1>Text Diff Tool</h1>
    <p class="subtitle">Compare two texts and highlight the differences</p>

    <div class="card">
        <div class="input-grid">
            <div class="input-section">
                <label for="text1">Original Text</label>
                <div class="editor-container">
                    <div class="line-numbers" id="lineNumbers1">
                        <div>1</div>
                    </div>
                    <textarea id="text1" placeholder="Enter original text..."></textarea>
                </div>
            </div>
            <div class="input-section">
                <label for="text2">Modified Text</label>
                <div class="editor-container">
                    <div class="line-numbers" id="lineNumbers2">
                        <div>1</div>
                    </div>
                    <textarea id="text2" placeholder="Enter modified text..."></textarea>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-compare" onclick="compare()">Compare</button>
            <button class="btn-swap" onclick="swap()">Swap</button>
            <button class="btn-clear" onclick="clearAll()">Clear</button>
        </div>
    </div>

    <div class="result-section" id="result">
        <div class="card">
            <div class="card-title">Diff Result</div>

            <div class="mode-toggle">
                <button class="mode-btn active" id="modeLineBtn" onclick="setMode('line')">Line by Line</button>
                <button class="mode-btn" id="modeCharBtn" onclick="setMode('char')">Character</button>
            </div>

            <div class="stats" id="stats"></div>
            <div class="diff-output" id="diffOutput"></div>
        </div>
    </div>
</div>

<script>
    const text1El = document.getElementById('text1');
    const text2El = document.getElementById('text2');
    const resultEl = document.getElementById('result');
    const diffOutputEl = document.getElementById('diffOutput');
    const statsEl = document.getElementById('stats');
    const lineNumbers1 = document.getElementById('lineNumbers1');
    const lineNumbers2 = document.getElementById('lineNumbers2');

    let currentMode = 'line';

    // Update line numbers for a textarea
    function updateLineNumbers(textarea, lineNumbersEl) {
        const lines = textarea.value.split('\n');
        const count = lines.length;
        let html = '';
        for (let i = 1; i <= count; i++) {
            html += `<div>${i}</div>`;
        }
        lineNumbersEl.innerHTML = html;
    }

    // Sync scroll between textarea and line numbers
    function syncScroll(textarea, lineNumbersEl) {
        lineNumbersEl.scrollTop = textarea.scrollTop;
    }

    // Initialize line numbers and event listeners
    function initEditor(textarea, lineNumbersEl) {
        updateLineNumbers(textarea, lineNumbersEl);
        textarea.addEventListener('input', () => {
            autoResize(textarea);
            updateLineNumbers(textarea, lineNumbersEl);
        });
        textarea.addEventListener('scroll', () => syncScroll(textarea, lineNumbersEl));
        // Initial resize
        autoResize(textarea);
    }

    // Auto-resize textarea
    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
    }

    initEditor(text1El, lineNumbers1);
    initEditor(text2El, lineNumbers2);
    let lastText1 = '';
    let lastText2 = '';

    function setMode(mode) {
        currentMode = mode;
        document.getElementById('modeLineBtn').classList.toggle('active', mode === 'line');
        document.getElementById('modeCharBtn').classList.toggle('active', mode === 'char');
        if (lastText1 || lastText2) {
            displayDiff(lastText1, lastText2);
        }
    }

    // Longest Common Subsequence for diff
    function lcs(a, b) {
        const m = a.length;
        const n = b.length;
        const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

        for (let i = 1; i <= m; i++) {
            for (let j = 1; j <= n; j++) {
                if (a[i - 1] === b[j - 1]) {
                    dp[i][j] = dp[i - 1][j - 1] + 1;
                } else {
                    dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                }
            }
        }

        // Backtrack to find diff
        const diff = [];
        let i = m, j = n;
        while (i > 0 || j > 0) {
            if (i > 0 && j > 0 && a[i - 1] === b[j - 1]) {
                diff.unshift({type: 'unchanged', value: a[i - 1]});
                i--;
                j--;
            } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                diff.unshift({type: 'added', value: b[j - 1]});
                j--;
            } else {
                diff.unshift({type: 'removed', value: a[i - 1]});
                i--;
            }
        }

        return diff;
    }

    const MAX_LINES_WARNING = 5000;
    const MAX_CHARS_WARNING = 100000;

    function compare() {
        const t1 = text1El.value;
        const t2 = text2El.value;

        if (!t1 && !t2) {
            return;
        }

        // Performance warning for large texts
        const lines1 = t1.split('\n').length;
        const lines2 = t2.split('\n').length;
        const totalChars = t1.length + t2.length;

        if (lines1 > MAX_LINES_WARNING || lines2 > MAX_LINES_WARNING || totalChars > MAX_CHARS_WARNING) {
            if (!confirm(`Warning: Large text detected (${Math.max(lines1, lines2)} lines, ${totalChars} characters). This may cause the browser to slow down. Continue?`)) {
                return;
            }
        }

        lastText1 = t1;
        lastText2 = t2;

        resultEl.classList.add('show');
        displayDiff(t1, t2);
    }

    function displayDiff(t1, t2) {
        if (t1 === t2) {
            statsEl.innerHTML = '';
            diffOutputEl.innerHTML = '<div class="identical-message">Texts are identical</div>';
            return;
        }

        if (currentMode === 'line') {
            displayLineDiff(t1, t2);
        } else {
            displayCharDiff(t1, t2);
        }
    }

    function displayLineDiff(t1, t2) {
        // Normalize: remove trailing empty line from split result if text doesn't end with newline
        const lines1 = t1.split('\n');
        const lines2 = t2.split('\n');

        // Track if texts end with newline
        const t1EndsWithNewline = t1.endsWith('\n');
        const t2EndsWithNewline = t2.endsWith('\n');

        // Remove the trailing empty string that split creates for trailing newlines
        // We'll handle newline endings separately
        if (t1EndsWithNewline && lines1[lines1.length - 1] === '') lines1.pop();
        if (t2EndsWithNewline && lines2[lines2.length - 1] === '') lines2.pop();

        const diff = lcs(lines1, lines2);

        let added = 0, removed = 0, unchanged = 0;
        let html = '';
        let lineNum1 = 1, lineNum2 = 1;

        diff.forEach(item => {
            const escaped = escapeHtml(item.value);
            const displayValue = escaped === '' ? '<span style="opacity:0.5;font-style:italic">(empty line)</span>' : escaped;

            if (item.type === 'added') {
                html += `<div class="diff-line added"><span class="line-num">+${lineNum2}</span>${displayValue}</div>`;
                lineNum2++;
                added++;
            } else if (item.type === 'removed') {
                html += `<div class="diff-line removed"><span class="line-num">-${lineNum1}</span>${displayValue}</div>`;
                lineNum1++;
                removed++;
            } else {
                html += `<div class="diff-line unchanged"><span class="line-num">${lineNum1}</span>${displayValue}</div>`;
                lineNum1++;
                lineNum2++;
                unchanged++;
            }
        });

        // Show trailing newline difference
        if (t1EndsWithNewline !== t2EndsWithNewline) {
            if (t1EndsWithNewline && !t2EndsWithNewline) {
                html += `<div class="diff-line removed"><span class="line-num">-</span><span style="opacity:0.7;font-style:italic">⏎ (trailing newline)</span></div>`;
                removed++;
            } else {
                html += `<div class="diff-line added"><span class="line-num">+</span><span style="opacity:0.7;font-style:italic">⏎ (trailing newline)</span></div>`;
                added++;
            }
        }

        statsEl.innerHTML = `
                <div class="stat-item added">
                    <div>
                        <div class="stat-value" style="color: var(--success)">${added}</div>
                        <div class="stat-label">Added</div>
                    </div>
                </div>
                <div class="stat-item removed">
                    <div>
                        <div class="stat-value" style="color: var(--danger)">${removed}</div>
                        <div class="stat-label">Removed</div>
                    </div>
                </div>
                <div class="stat-item unchanged">
                    <div>
                        <div class="stat-value" style="color: var(--text-dim)">${unchanged}</div>
                        <div class="stat-label">Unchanged</div>
                    </div>
                </div>
            `;

        diffOutputEl.innerHTML = html;
    }

    function displayCharDiff(t1, t2) {
        const chars1 = t1.split('');
        const chars2 = t2.split('');
        const diff = lcs(chars1, chars2);

        let added = 0, removed = 0;
        let lineNum = 1;
        let html = '<div class="char-diff-container">';
        html += `<span class="char-line-num">${lineNum}</span>`;

        diff.forEach(item => {
            const escaped = escapeHtml(item.value);

            if (item.type === 'added') {
                if (item.value === '\n') {
                    html += `<span class="char-added char-newline">↵</span><br>`;
                    lineNum++;
                    html += `<span class="char-line-num">${lineNum}</span>`;
                } else if (item.value === ' ') {
                    html += `<span class="char-added char-space">·</span>`;
                } else if (item.value === '\t') {
                    html += `<span class="char-added char-tab">→</span>`;
                } else {
                    html += `<span class="char-added">${escaped}</span>`;
                }
                added++;
            } else if (item.type === 'removed') {
                if (item.value === '\n') {
                    html += `<span class="char-removed char-newline">↵</span>`;
                } else if (item.value === ' ') {
                    html += `<span class="char-removed char-space">·</span>`;
                } else if (item.value === '\t') {
                    html += `<span class="char-removed char-tab">→</span>`;
                } else {
                    html += `<span class="char-removed">${escaped}</span>`;
                }
                removed++;
            } else {
                if (item.value === '\n') {
                    html += '<br>';
                    lineNum++;
                    html += `<span class="char-line-num">${lineNum}</span>`;
                } else {
                    html += escaped;
                }
            }
        });

        html += '</div>';

        statsEl.innerHTML = `
                <div class="stat-item added">
                    <div>
                        <div class="stat-value" style="color: var(--success)">${added}</div>
                        <div class="stat-label">Characters Added</div>
                    </div>
                </div>
                <div class="stat-item removed">
                    <div>
                        <div class="stat-value" style="color: var(--danger)">${removed}</div>
                        <div class="stat-label">Characters Removed</div>
                    </div>
                </div>
            `;

        diffOutputEl.innerHTML = html;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function swap() {
        const temp = text1El.value;
        text1El.value = text2El.value;
        text2El.value = temp;
        updateLineNumbers(text1El, lineNumbers1);
        updateLineNumbers(text2El, lineNumbers2);
        autoResize(text1El);
        autoResize(text2El);
    }

    function clearAll() {
        text1El.value = '';
        text2El.value = '';
        resultEl.classList.remove('show');
        lastText1 = '';
        lastText2 = '';
        updateLineNumbers(text1El, lineNumbers1);
        updateLineNumbers(text2El, lineNumbers2);
        autoResize(text1El);
        autoResize(text2El);
    }
</script>
</body>
</html>
