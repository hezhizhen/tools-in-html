<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Base64 Encoder/Decoder</title>
    <style>
        :root {
            --bg: #1C1916;
            --surface: #25211C;
            --surface-strong: #2E2924;
            --border: #3A332B;
            --border-hover: #5A4D3D;
            --text: #EFE6D5;
            --text-muted: #A39A8C;
            --text-dim: #6E6358;
            --clay: #D4844C;
            --clay-soft: #E5A77A;
            --clay-deep: #8B4A28;
            --burgundy: #A85B3C;
            --danger: #F87171;
            --warn: #F59E0B;
            --success: #4ADE80;
            --info: #93C5FD;
            --radius: 8px;
            --transition: 150ms ease-out;
            --serif: 'Iowan Old Style', 'Charter', 'Bookerly', Georgia, serif;
            --sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background: var(--bg);
            min-height: 100vh;
            padding: 48px 24px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--serif);
            font-size: 26px;
            font-weight: 400;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-family: var(--serif);
            font-style: italic;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: var(--text);
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            color: var(--text);
            font-size: 14px;
        }

        textarea {
            width: 100%;
            min-height: 60px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text);
            font-size: 13px;
            font-family: var(--mono);
            line-height: 1.5;
            resize: none;
            overflow: hidden;
            transition: border-color var(--transition);
        }

        textarea:focus {
            outline: none;
            border-color: var(--border-hover);
        }

        textarea::placeholder {
            color: var(--text-dim);
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin: 16px 0;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 96px;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }

        button:hover {
            background: var(--surface-strong);
            border-color: var(--border-hover);
        }

        .btn-encode {
            background: var(--clay);
            color: var(--bg);
            border-color: var(--clay);
        }

        .btn-encode:hover {
            background: var(--clay-soft);
            border-color: var(--clay-soft);
        }

        .btn-clear:hover {
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.3);
        }

        .swap-btn {
            display: flex;
            justify-content: center;
            margin: 8px 0;
        }

        .swap-btn button {
            flex: none;
            width: 36px;
            height: 36px;
            min-width: 0;
            padding: 0;
            border-radius: 50%;
            font-size: 14px;
            color: var(--text-muted);
        }

        .message {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 8px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 13px;
            display: none;
            z-index: 1000;
        }

        .message.success {
            display: block;
            color: var(--success);
            border-color: rgba(74, 222, 128, 0.3);
        }

        .message.error {
            display: block;
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.3);
        }

        @media (max-width: 480px) {
            body {
                padding: 24px 16px;
            }

            h1 {
                font-size: 20px;
            }

            .card {
                padding: 16px;
            }
        }

        /* Editorial system-level: text selection, scrollbar, keyboard focus */
        ::selection {
            background: rgba(213, 132, 76, 0.35);
            color: var(--text);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
            border: 2px solid var(--bg);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        :focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: 2px;
            border-radius: 3px;
        }

        button:focus-visible,
        a:focus-visible {
            outline-offset: 3px;
        }
    </style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← Back to Tools</a>
    <h1>Base64 Encoder/Decoder</h1>
    <p class="subtitle">Encode and decode Base64 strings with Unicode support</p>

    <div class="card">
        <label for="input">Input</label>
        <textarea id="input" placeholder="Enter text to encode or decode..."></textarea>
    </div>

    <div class="button-group">
        <button class="btn-encode" onclick="encode()">Encode</button>
        <button class="btn-decode" onclick="decode()">Decode</button>
    </div>

    <div class="swap-btn">
        <button onclick="swap()" title="Swap input and output">⇅</button>
    </div>

    <div class="card">
        <label for="output">Output</label>
        <textarea id="output" placeholder="Result will be shown here..." readonly></textarea>
        <div class="button-group" style="margin-bottom: 0;">
            <button class="btn-copy" onclick="copyResult()">Copy</button>
            <button class="btn-clear" onclick="clearAll()">Clear</button>
        </div>
    </div>
</div>
<div class="message" id="message" aria-live="polite"></div>

<script>
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const messageEl = document.getElementById('message');

    // Auto-resize textarea
    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = textarea.scrollHeight + 'px';
    }

    inputEl.addEventListener('input', () => autoResize(inputEl));

    // Initial resize
    autoResize(inputEl);
    autoResize(outputEl);

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = 'message ' + type;
        setTimeout(() => {
            messageEl.className = 'message';
        }, 3000);
    }

    function encode() {
        const text = inputEl.value.trim();
        if (!text) {
            showMessage('Please enter text to encode', 'error');
            return;
        }
        try {
            // Support Unicode characters
            const bytes = new TextEncoder().encode(text);
            const encoded = btoa(Array.from(bytes, b => String.fromCharCode(b)).join(''));
            outputEl.value = encoded;
            autoResize(outputEl);
            showMessage('Encoded successfully', 'success');
        } catch (e) {
            showMessage('Encode failed: ' + e.message, 'error');
        }
    }

    function decode() {
        const text = inputEl.value.trim();
        if (!text) {
            showMessage('Please enter text to decode', 'error');
            return;
        }
        try {
            // Support Unicode characters
            const bytes = Uint8Array.from(atob(text), c => c.charCodeAt(0));
            const decoded = new TextDecoder().decode(bytes);
            outputEl.value = decoded;
            autoResize(outputEl);
            showMessage('Decoded successfully', 'success');
        } catch (e) {
            showMessage('Decode failed: Please enter a valid Base64 string', 'error');
        }
    }

    function swap() {
        const temp = inputEl.value;
        inputEl.value = outputEl.value;
        outputEl.value = temp;
        autoResize(inputEl);
        autoResize(outputEl);
    }

    function copyResult() {
        const text = outputEl.value;
        if (!text) {
            showMessage('Nothing to copy', 'error');
            return;
        }
        navigator.clipboard.writeText(text).then(() => {
            showMessage('Copied to clipboard', 'success');
        }).catch(() => {
            // Fallback
            outputEl.select();
            document.execCommand('copy');
            showMessage('Copied to clipboard', 'success');
        });
    }

    function clearAll() {
        inputEl.value = '';
        outputEl.value = '';
        autoResize(inputEl);
        autoResize(outputEl);
        showMessage('Cleared', 'success');
    }
</script>
</body>
</html>
