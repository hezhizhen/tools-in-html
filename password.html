<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Password Generator</title>
    <style>
        :root {
            --bg: #1C1916;
            --surface: #25211C;
            --surface-strong: #2E2924;
            --border: #3A332B;
            --border-hover: #5A4D3D;
            --text: #EFE6D5;
            --text-muted: #A39A8C;
            --text-dim: #6E6358;
            --clay: #D4844C;
            --clay-soft: #E5A77A;
            --clay-deep: #8B4A28;
            --burgundy: #A85B3C;
            --danger: #F87171;
            --warn: #F59E0B;
            --success: #4ADE80;
            --info: #93C5FD;
            --radius: 8px;
            --transition: 150ms ease-out;
            --serif: 'Iowan Old Style', 'Charter', 'Bookerly', Georgia, serif;
            --sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            background: var(--bg);
            min-height: 100vh;
            padding: 48px 24px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--serif);
            font-size: 26px;
            font-weight: 400;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-family: var(--serif);
            font-style: italic;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: color var(--transition);
        }

        .back-link:hover {
            color: var(--text);
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 12px;
        }

        .label {
            display: block;
            margin-bottom: 10px;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            color: var(--text);
            font-size: 14px;
        }

        .label-accent {
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .password-display {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            font-family: var(--mono);
            font-size: 18px;
            letter-spacing: 0.02em;
            text-align: center;
            word-break: break-all;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            cursor: pointer;
            transition: border-color var(--transition), background var(--transition);
        }

        .password-display:hover {
            border-color: var(--border-hover);
        }

        .password-display:active {
            background: rgba(255, 255, 255, 0.04);
        }

        .strength-bar {
            height: 2px;
            border-radius: 2px;
            margin-top: 12px;
            background: var(--border);
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width var(--transition), background var(--transition);
        }

        .strength-fill.weak {
            width: 33%;
            background: var(--danger);
        }

        .strength-fill.medium {
            width: 66%;
            background: var(--warn);
        }

        .strength-fill.strong {
            width: 100%;
            background: var(--success);
        }

        .strength-text {
            font-family: var(--serif);
            font-style: italic;
            font-size: 13px;
            margin-top: 8px;
            color: var(--text-muted);
            text-align: center;
        }

        .length-control {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .length-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 2px;
            border-radius: 2px;
            background: var(--border);
            outline: none;
        }

        .length-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--clay);
            cursor: pointer;
            transition: transform var(--transition);
        }

        .length-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .length-slider::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--clay);
            cursor: pointer;
            border: none;
        }

        .length-value {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            min-width: 32px;
            text-align: center;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            transition: background var(--transition), border-color var(--transition);
        }

        .checkbox-label:hover {
            background: rgba(0, 0, 0, 0.3);
            border-color: var(--border-hover);
        }

        .checkbox-label input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: var(--clay);
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition);
        }

        button:hover {
            background: var(--surface-strong);
            border-color: var(--border-hover);
        }

        .btn-generate {
            background: var(--clay);
            color: var(--bg);
            border-color: var(--clay);
        }

        .btn-generate:hover {
            background: var(--clay-soft);
            border-color: var(--clay-soft);
        }

        .message {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 8px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 13px;
            display: none;
            z-index: 1000;
        }

        .message.success {
            display: block;
            color: var(--success);
            border-color: rgba(74, 222, 128, 0.3);
        }

        .message.error {
            display: block;
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.3);
        }

        @media (max-width: 480px) {
            body {
                padding: 24px 16px;
            }

            h1 {
                font-size: 20px;
            }

            .card {
                padding: 16px;
            }

            .options {
                grid-template-columns: 1fr;
            }
        }

        /* Editorial system-level: text selection, scrollbar, keyboard focus */
        ::selection {
            background: rgba(213, 132, 76, 0.35);
            color: var(--text);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
            border: 2px solid var(--bg);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        :focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: 2px;
            border-radius: 3px;
        }

        button:focus-visible,
        a:focus-visible {
            outline-offset: 3px;
        }
    </style>
</head>
<body>
<div class="container">
    <a class="back-link" href="index.html">← Back to Tools</a>
    <h1>Password Generator</h1>
    <p class="subtitle">Generate secure random passwords</p>

    <div class="card">
        <div class="label">Generated Password</div>
        <div class="password-display" id="password" onclick="copyPassword()" title="Click to copy"></div>
        <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
        </div>
        <div class="strength-text" id="strengthText">Password strength</div>
    </div>

    <div class="card">
        <div class="label">Password Length <span class="label-accent">8–128</span></div>
        <div class="length-control">
            <input class="length-slider" id="lengthSlider" max="128" min="8" type="range" value="16">
            <span class="length-value" id="lengthValue">16</span>
        </div>
    </div>

    <div class="card">
        <div class="label">Character Types</div>
        <div class="options">
            <label class="checkbox-label">
                <input checked id="uppercase" type="checkbox">
                <span>Uppercase (A-Z)</span>
            </label>
            <label class="checkbox-label">
                <input checked id="lowercase" type="checkbox">
                <span>Lowercase (a-z)</span>
            </label>
            <label class="checkbox-label">
                <input checked id="numbers" type="checkbox">
                <span>Numbers (0-9)</span>
            </label>
            <label class="checkbox-label">
                <input checked id="symbols" type="checkbox">
                <span>Symbols (!@#$%)</span>
            </label>
        </div>
    </div>

    <div class="button-group">
        <button class="btn-generate" onclick="generate()">Generate Password</button>
        <button class="btn-copy" onclick="copyPassword()">Copy</button>
    </div>
</div>

<div class="message" id="message" aria-live="polite"></div>

<script>
    const CHAR_SETS = {
        uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lowercase: 'abcdefghijklmnopqrstuvwxyz',
        numbers: '0123456789',
        symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };

    const passwordEl = document.getElementById('password');
    const strengthFillEl = document.getElementById('strengthFill');
    const strengthTextEl = document.getElementById('strengthText');
    const lengthSliderEl = document.getElementById('lengthSlider');
    const lengthValueEl = document.getElementById('lengthValue');
    const messageEl = document.getElementById('message');

    // Update length display
    lengthSliderEl.addEventListener('input', () => {
        lengthValueEl.textContent = lengthSliderEl.value;
        generate();
    });

    // Auto-generate on option change
    ['uppercase', 'lowercase', 'numbers', 'symbols'].forEach(id => {
        document.getElementById(id).addEventListener('change', () => {
            // Ensure at least one option is selected
            const anyChecked = ['uppercase', 'lowercase', 'numbers', 'symbols']
                .some(id => document.getElementById(id).checked);
            if (!anyChecked) {
                document.getElementById(id).checked = true;
                showMessage('Please select at least one character type', 'error');
                return;
            }
            generate();
        });
    });

    function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = 'message ' + type;
        clearTimeout(showMessage._t);
        showMessage._t = setTimeout(() => {
            messageEl.className = 'message';
        }, 3000);
    }

    function generate() {
        const length = parseInt(lengthSliderEl.value);
        let chars = '';
        let passwordChars = [];

        // Collect selected character sets
        const selectedSets = [];
        if (document.getElementById('uppercase').checked) {
            chars += CHAR_SETS.uppercase;
            selectedSets.push(CHAR_SETS.uppercase);
        }
        if (document.getElementById('lowercase').checked) {
            chars += CHAR_SETS.lowercase;
            selectedSets.push(CHAR_SETS.lowercase);
        }
        if (document.getElementById('numbers').checked) {
            chars += CHAR_SETS.numbers;
            selectedSets.push(CHAR_SETS.numbers);
        }
        if (document.getElementById('symbols').checked) {
            chars += CHAR_SETS.symbols;
            selectedSets.push(CHAR_SETS.symbols);
        }

        // Ensure at least one character from each selected set
        const guaranteedCount = Math.min(selectedSets.length, length);
        const guaranteedRandom = new Uint32Array(guaranteedCount);
        crypto.getRandomValues(guaranteedRandom);
        for (let i = 0; i < guaranteedCount; i++) {
            const set = selectedSets[i];
            passwordChars.push(set.charAt(guaranteedRandom[i] % set.length));
        }

        // Fill remaining with random characters from combined set
        const remainingCount = length - guaranteedCount;
        if (remainingCount > 0) {
            const remainingRandom = new Uint32Array(remainingCount);
            crypto.getRandomValues(remainingRandom);
            for (let i = 0; i < remainingCount; i++) {
                passwordChars.push(chars.charAt(remainingRandom[i] % chars.length));
            }
        }

        // Fisher-Yates shuffle
        const shuffleRandom = new Uint32Array(passwordChars.length);
        crypto.getRandomValues(shuffleRandom);
        for (let i = passwordChars.length - 1; i > 0; i--) {
            const j = shuffleRandom[i] % (i + 1);
            [passwordChars[i], passwordChars[j]] = [passwordChars[j], passwordChars[i]];
        }

        passwordEl.textContent = passwordChars.join('');
        updateStrength(passwordChars.join(''));
    }

    function updateStrength(password) {
        let score = 0;

        // Length score
        if (password.length >= 12) score += 1;
        if (password.length >= 16) score += 1;

        // Character variety
        if (/[a-z]/.test(password)) score += 1;
        if (/[A-Z]/.test(password)) score += 1;
        if (/[0-9]/.test(password)) score += 1;
        if (/[^a-zA-Z0-9]/.test(password)) score += 1;

        strengthFillEl.className = 'strength-fill';

        if (score <= 2) {
            strengthFillEl.classList.add('weak');
            strengthTextEl.textContent = 'Weak';
            strengthTextEl.style.color = 'var(--danger)';
        } else if (score <= 4) {
            strengthFillEl.classList.add('medium');
            strengthTextEl.textContent = 'Medium';
            strengthTextEl.style.color = 'var(--warn)';
        } else {
            strengthFillEl.classList.add('strong');
            strengthTextEl.textContent = 'Strong';
            strengthTextEl.style.color = 'var(--success)';
        }
    }

    function copyPassword() {
        const password = passwordEl.textContent;
        if (!password) {
            showMessage('No password to copy', 'error');
            return;
        }

        navigator.clipboard.writeText(password).then(() => {
            showMessage('Password copied to clipboard', 'success');
        }).catch(() => {
            showMessage('Failed to copy', 'error');
        });
    }

    // Generate on load
    generate();
</script>
</body>
</html>
