<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Timestamp Converter</title>
    <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet" integrity="sha384-RkASv+6KfBMW9eknReJIJ6b3UnjKOKC5bOUaNgIY778NFbQ8MtWq9Lr/khUgqtTt" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/themes/dark.css" rel="stylesheet" integrity="sha384-heUUtXw0Djj2DElfLOVPlASSWFKNL3JDY6s3FEqQD03GYyWOeophY5DsfEG40sYX" crossorigin="anonymous">
    <style>
        :root {
            --bg: #1C1916;
            --surface: #25211C;
            --surface-strong: #2E2924;
            --border: #3A332B;
            --border-hover: #5A4D3D;
            --text: #EFE6D5;
            --text-muted: #A39A8C;
            --text-dim: #6E6358;
            --clay: #D4844C;
            --clay-soft: #E5A77A;
            --clay-deep: #8B4A28;
            --burgundy: #A85B3C;
            --danger: #F87171;
            --warn: #F59E0B;
            --success: #4ADE80;
            --info: #93C5FD;
            --radius: 8px;
            --transition: 150ms ease-out;
            --serif: 'Iowan Old Style', 'Charter', 'Bookerly', Georgia, serif;
            --sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { color-scheme: dark; }

        body {
            font-family: var(--sans);
            font-size: 14px;
            line-height: 1.5;
            background: var(--bg);
            min-height: 100vh;
            padding: 48px 24px;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .container { max-width: 600px; margin: 0 auto; }

        h1 {
            font-family: var(--serif);
            font-size: 26px;
            font-weight: 400;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 4px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-family: var(--serif);
            font-style: italic;
            margin-bottom: 32px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 24px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: color var(--transition);
        }

        .back-link:hover { color: var(--text); }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-family: var(--serif);
            font-style: italic;
            font-weight: 400;
            color: var(--text);
            font-size: 14px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-row input[type="text"] {
            flex: 1;
        }

        input[type="text"] {
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text);
            font-size: 14px;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            transition: border-color var(--transition);
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--border-hover);
        }

        input[type="text"]::placeholder {
            color: var(--text-dim);
            font-family: var(--sans);
        }

        button {
            padding: 9px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }

        button:hover {
            background: var(--surface-strong);
            border-color: var(--border-hover);
        }

        .btn-now {
            background: var(--clay);
            color: var(--bg);
            border-color: var(--clay);
        }

        .btn-now:hover {
            background: var(--clay-soft);
            border-color: var(--clay-soft);
            color: var(--bg);
        }

        .detected {
            margin-top: 10px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            min-height: 14px;
        }

        .edit-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 12px;
        }

        .edit-row input[type="text"] {
            flex: 1;
        }

        .picker-wrap {
            position: relative;
            flex: 1;
            display: flex;
        }

        .picker-wrap input[type="text"] {
            flex: 1;
            padding-right: 34px;
        }

        .picker-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            pointer-events: none;
            display: flex;
            align-items: center;
            transition: color var(--transition);
        }

        .picker-wrap input[type="text"]:focus ~ .picker-icon {
            color: var(--clay);
        }

        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
        }

        .split > .col-left {
            border-right: 1px dashed var(--border);
            padding-right: 20px;
        }

        .split > .col-right {
            padding-left: 20px;
        }

        .offset-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 10px;
        }

        .offset-btn {
            padding: 6px 10px;
            font-size: 12px;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-muted);
        }

        .offset-btn:hover {
            color: var(--clay);
        }

        /* Flatpickr — dark theme token overrides */
        .flatpickr-calendar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        .flatpickr-calendar.arrowTop:before,
        .flatpickr-calendar.arrowTop:after {
            border-bottom-color: var(--surface);
        }

        .flatpickr-months .flatpickr-month {
            background: transparent;
            color: var(--text);
        }

        .flatpickr-current-month .flatpickr-monthDropdown-months,
        .flatpickr-current-month input.cur-year {
            color: var(--text);
            font-weight: 500;
        }

        .flatpickr-monthDropdown-months:hover { background: var(--surface-strong); }

        .flatpickr-months .flatpickr-prev-month,
        .flatpickr-months .flatpickr-next-month {
            color: var(--text);
            fill: var(--text);
        }

        .flatpickr-months .flatpickr-prev-month:hover svg,
        .flatpickr-months .flatpickr-next-month:hover svg { fill: var(--text); }

        .flatpickr-weekdays { background: transparent; }
        span.flatpickr-weekday { color: var(--text-dim); font-weight: 500; }
        .flatpickr-days { background: transparent; }

        .flatpickr-day {
            color: var(--text-muted);
            border-radius: 4px;
        }

        .flatpickr-day:hover {
            background: var(--surface-strong);
            border-color: transparent;
        }

        .flatpickr-day.selected {
            background: var(--clay);
            border-color: var(--clay);
            color: var(--bg);
        }

        .flatpickr-day.today { border-color: var(--border-hover); }
        .flatpickr-day.today:hover { background: var(--surface-strong); }

        .flatpickr-day.prevMonthDay,
        .flatpickr-day.nextMonthDay {
            color: var(--text-dim);
            opacity: 0.5;
        }

        .flatpickr-time {
            background: transparent;
            border-top: 1px solid var(--border);
        }

        .flatpickr-time input {
            color: var(--text);
            font-size: 14px;
        }

        .flatpickr-time input:hover,
        .flatpickr-time input:focus { background: var(--surface-strong); }

        .flatpickr-time .flatpickr-time-separator,
        .flatpickr-time .flatpickr-am-pm { color: var(--text); }

        .flatpickr-time .flatpickr-am-pm:hover { background: var(--surface-strong); }

        .numInputWrapper:hover { background: var(--surface-strong); }
        .numInputWrapper span { border-color: var(--border); }
        .numInputWrapper span:hover { background: rgba(213, 132, 76, 0.18); }
        .numInputWrapper span:after {
            border-color: var(--text) transparent transparent transparent;
        }
        .numInputWrapper span.arrowUp:after { border-bottom-color: var(--text); }
        .numInputWrapper span.arrowDown:after { border-top-color: var(--text); }
        .numInputWrapper span:hover:after {
            border-bottom-color: var(--clay) !important;
            border-top-color: var(--clay) !important;
        }

        .flatpickr-day:focus {
            background: var(--surface-strong);
            border-color: transparent;
            outline: none;
        }

        .flatpickr-day.flatpickr-disabled,
        .flatpickr-day.flatpickr-disabled:hover {
            color: var(--text-dim);
            opacity: 0.35;
            background: transparent;
            cursor: not-allowed;
        }

        .detected .clay {
            color: var(--clay);
        }

        .detected .danger {
            color: var(--danger);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-top: 1px solid var(--border);
        }

        .result-row:first-child {
            border-top: none;
        }

        .result-row:nth-child(5) {
            border-top-color: var(--border-hover);
            margin-top: 4px;
            padding-top: 14px;
        }

        .result-label {
            font-family: var(--serif);
            font-style: italic;
            color: var(--text-muted);
            font-size: 13px;
            flex-shrink: 0;
            min-width: 88px;
        }

        .result-value {
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            color: var(--text);
            font-size: 13px;
            text-align: right;
            word-break: break-all;
            cursor: pointer;
            transition: color var(--transition);
            padding: 2px 6px;
            margin: -2px -6px;
            border-radius: 4px;
        }

        .result-value:hover {
            color: var(--clay);
            background: var(--surface-strong);
        }

        .result-value.empty {
            color: var(--text-dim);
            cursor: default;
        }

        .result-value.empty:hover {
            color: var(--text-dim);
            background: transparent;
        }

        .result-value.error {
            color: var(--danger);
            cursor: default;
        }

        .result-value.error:hover {
            color: var(--danger);
            background: transparent;
        }

        @keyframes flash-copy {
            0%   { background: rgba(213, 132, 76, 0.35); color: var(--clay); }
            100% { background: transparent; }
        }

        .result-value.copied {
            animation: flash-copy 450ms ease-out;
        }

        .relative {
            color: var(--clay);
            cursor: default;
        }

        .result-value.relative:hover {
            color: var(--clay);
            background: transparent;
        }

        .message {
            position: fixed;
            top: 16px;
            right: 16px;
            padding: 8px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg);
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease-out;
            z-index: 1000;
        }

        .message.show {
            opacity: 1;
        }

        .message.success {
            color: var(--success);
            border-color: rgba(74, 222, 128, 0.3);
        }

        .message.error {
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.3);
        }

        @media (max-width: 640px) {
            body { padding: 24px 16px; }
            h1 { font-size: 20px; }
            .card { padding: 14px; }

            .split {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .split > .col-left {
                border-right: none;
                padding-right: 0;
                padding-bottom: 16px;
                border-bottom: 1px dashed var(--border);
            }

            .split > .col-right {
                padding-left: 0;
            }

            .result-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 2px;
            }

            .result-value {
                text-align: left;
                font-size: 12px;
            }
        }

        ::selection {
            background: rgba(213, 132, 76, 0.35);
            color: var(--text);
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
            border: 2px solid var(--bg);
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

        :focus-visible {
            outline: 2px solid var(--clay);
            outline-offset: 2px;
            border-radius: 3px;
        }

        button:focus-visible,
        a:focus-visible {
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <div class="container">
        <a class="back-link" href="index.html">← Back to Tools</a>
        <h1>Timestamp Converter</h1>
        <p class="subtitle">Unix timestamps in, readable time out</p>

        <div class="card">
            <div class="split">
                <div class="col col-left">
                    <label for="timestamp">Timestamp</label>
                    <div class="input-row">
                        <input id="timestamp" placeholder="e.g. 1760556959473" type="text" autocomplete="off" spellcheck="false" inputmode="numeric">
                        <button class="btn-now" onclick="useNow()" type="button">Now</button>
                    </div>
                    <div class="detected" id="detected">&nbsp;</div>
                </div>
                <div class="col col-right">
                    <label for="picker">Edit (local time)</label>
                    <div class="edit-row">
                        <div class="picker-wrap">
                            <input id="picker" placeholder="Pick a date & time" type="text" autocomplete="off" spellcheck="false">
                            <span class="picker-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                                    <path d="M8 2v4"/>
                                    <path d="M16 2v4"/>
                                    <path d="M3 10h18"/>
                                </svg>
                            </span>
                        </div>
                    </div>
                    <div class="offset-row">
                        <button class="offset-btn" data-offset="1000" type="button" aria-label="Add 1 second" title="Add 1 second">+1s</button>
                        <button class="offset-btn" data-offset="60000" type="button" aria-label="Add 1 minute" title="Add 1 minute">+1m</button>
                        <button class="offset-btn" data-offset="3600000" type="button" aria-label="Add 1 hour" title="Add 1 hour">+1h</button>
                        <button class="offset-btn" data-offset="86400000" type="button" aria-label="Add 1 day" title="Add 1 day">+1d</button>
                        <button class="offset-btn" data-offset="-1000" type="button" aria-label="Subtract 1 second" title="Subtract 1 second">−1s</button>
                        <button class="offset-btn" data-offset="-60000" type="button" aria-label="Subtract 1 minute" title="Subtract 1 minute">−1m</button>
                        <button class="offset-btn" data-offset="-3600000" type="button" aria-label="Subtract 1 hour" title="Subtract 1 hour">−1h</button>
                        <button class="offset-btn" data-offset="-86400000" type="button" aria-label="Subtract 1 day" title="Subtract 1 day">−1d</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="result-row">
                <span class="result-label">Local</span>
                <span class="result-value empty" id="local" data-copy="">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">UTC</span>
                <span class="result-value empty" id="utc" data-copy="">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">ISO 8601</span>
                <span class="result-value empty" id="iso" data-copy="">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">Relative</span>
                <span class="result-value empty relative" id="relative" data-copy="">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">Seconds</span>
                <span class="result-value empty" id="seconds" data-copy="">—</span>
            </div>
            <div class="result-row">
                <span class="result-label">Milliseconds</span>
                <span class="result-value empty" id="millis" data-copy="">—</span>
            </div>
        </div>

        <div class="message" id="message" aria-live="polite"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.js" integrity="sha384-sWZVghjWvu7FLPv6FOuk8kWJYnlZApKfPfxhdPgM1gcwvD0ys/iFrhE3Xr76HJV3" crossorigin="anonymous"></script>
    <script>
        const inputEl = document.getElementById('timestamp');
        const detectedEl = document.getElementById('detected');
        const pickerEl = document.getElementById('picker');
        const messageEl = document.getElementById('message');

        const fields = {
            local: document.getElementById('local'),
            utc: document.getElementById('utc'),
            iso: document.getElementById('iso'),
            relative: document.getElementById('relative'),
            seconds: document.getElementById('seconds'),
            millis: document.getElementById('millis'),
        };

        const EMPTY = '—';

        // Single source of truth.
        // `ms` is a Number (may be fractional when input is µs/ns).
        // `unit` is what the user's input is denominated in — we echo it back in the
        // timestamp field when the picker/offset buttons mutate state.
        // `subMs` holds the sub-millisecond remainder (in ms) so we don't lose µs/ns
        // precision when the user edits via the picker, which is only second-accurate.
        const state = {
            ms: null,
            unit: 'ms',
            subMs: 0,
        };

        // Guards against onChange → setMs → setDate → onChange feedback loops.
        let suppressSync = false;

        function detectUnit(raw) {
            const s = raw.trim();
            if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
            const intPart = s.replace(/^-/, '').split('.')[0];
            const len = intPart.length;
            if (len <= 10) return { unit: 's', label: 'seconds' };
            if (len <= 13) return { unit: 'ms', label: 'milliseconds' };
            if (len <= 16) return { unit: 'us', label: 'microseconds' };
            return { unit: 'ns', label: 'nanoseconds' };
        }

        function toMillis(raw, unit) {
            const n = Number(raw);
            switch (unit) {
                case 's': return n * 1000;
                case 'ms': return n;
                case 'us': return n / 1000;
                case 'ns': return n / 1e6;
            }
        }

        function msToUnitString(ms, unit) {
            switch (unit) {
                case 's': {
                    const v = ms / 1000;
                    return Number.isInteger(v) ? String(v) : v.toFixed(3).replace(/\.?0+$/, '');
                }
                case 'ms': return String(Math.round(ms));
                case 'us': return String(Math.round(ms * 1000));
                case 'ns': return String(Math.round(ms * 1e6));
            }
        }

        function formatLocal(date) {
            const pad = (n, w = 2) => String(n).padStart(w, '0');
            const y = date.getFullYear();
            const mo = pad(date.getMonth() + 1);
            const d = pad(date.getDate());
            const h = pad(date.getHours());
            const mi = pad(date.getMinutes());
            const se = pad(date.getSeconds());
            const weekday = date.toLocaleDateString(undefined, { weekday: 'short' });
            const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
            return `${y}-${mo}-${d} ${h}:${mi}:${se} ${weekday} (${tz})`;
        }

        function formatUTC(date) {
            const pad = (n, w = 2) => String(n).padStart(w, '0');
            const y = date.getUTCFullYear();
            const mo = pad(date.getUTCMonth() + 1);
            const d = pad(date.getUTCDate());
            const h = pad(date.getUTCHours());
            const mi = pad(date.getUTCMinutes());
            const se = pad(date.getUTCSeconds());
            const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const weekday = weekdays[date.getUTCDay()];
            return `${y}-${mo}-${d} ${h}:${mi}:${se} ${weekday} UTC`;
        }

        function formatRelative(date) {
            const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
            const diffMs = date.getTime() - Date.now();
            const abs = Math.abs(diffMs);
            const units = [
                ['year', 365.25 * 24 * 60 * 60 * 1000],
                ['month', 30.4375 * 24 * 60 * 60 * 1000],
                ['week', 7 * 24 * 60 * 60 * 1000],
                ['day', 24 * 60 * 60 * 1000],
                ['hour', 60 * 60 * 1000],
                ['minute', 60 * 1000],
                ['second', 1000],
            ];
            for (const [unit, ms] of units) {
                if (abs >= ms || unit === 'second') {
                    const value = Math.round(diffMs / ms);
                    return rtf.format(value, unit);
                }
            }
            return rtf.format(0, 'second');
        }

        function setEmpty() {
            detectedEl.innerHTML = '&nbsp;';
            for (const key of Object.keys(fields)) {
                const el = fields[key];
                el.textContent = EMPTY;
                el.dataset.copy = '';
                el.className = 'result-value empty' + (key === 'relative' ? ' relative' : '');
            }
            suppressSync = true;
            picker.clear();
            suppressSync = false;
        }

        function setError(msg) {
            detectedEl.innerHTML = `<span class="danger">${msg}</span>`;
            for (const key of Object.keys(fields)) {
                const el = fields[key];
                el.textContent = EMPTY;
                el.dataset.copy = '';
                el.className = 'result-value error' + (key === 'relative' ? ' relative' : '');
            }
        }

        // The single channel through which every UI updates flow.
        // source: 'input' | 'picker' | 'offset' | 'now' — determines which UI piece
        // we can skip writing back to (the one the change came from).
        function setMs(ms, unit, source) {
            if (!Number.isFinite(ms)) {
                setError('Out of range');
                return;
            }
            const date = new Date(ms);
            if (isNaN(date.getTime())) {
                setError('Out of range');
                return;
            }

            state.ms = ms;
            state.unit = unit;
            // Preserve the fractional ms part so picker round-trips don't lose µs/ns.
            state.subMs = ms - Math.floor(ms / 1000) * 1000;

            // Detected-unit label (always visible while state is valid).
            const label = { s: 'seconds', ms: 'milliseconds', us: 'microseconds', ns: 'nanoseconds' }[unit];
            detectedEl.innerHTML = `Detected <span class="clay">${label}</span>`;

            // Write to timestamp input (skip if the change originated there).
            if (source !== 'input') {
                inputEl.value = msToUnitString(ms, unit);
            }

            // Write to picker (skip if the change originated there).
            if (source !== 'picker') {
                suppressSync = true;
                picker.setDate(new Date(Math.floor(ms / 1000) * 1000), false);
                suppressSync = false;
            }

            // Result card.
            const values = {
                local: formatLocal(date),
                utc: formatUTC(date),
                iso: date.toISOString(),
                relative: formatRelative(date),
                seconds: msToUnitString(ms, 's'),
                millis: msToUnitString(ms, 'ms'),
            };
            for (const [key, val] of Object.entries(values)) {
                const el = fields[key];
                el.textContent = val;
                el.dataset.copy = val;
                el.className = 'result-value' + (key === 'relative' ? ' relative' : '');
            }
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'message show ' + type;
            clearTimeout(showMessage._t);
            showMessage._t = setTimeout(() => {
                messageEl.className = 'message';
            }, 1600);
        }

        function useNow() {
            setMs(Date.now(), state.unit || 'ms', 'now');
            inputEl.focus();
            inputEl.select();
        }

        // --- Flatpickr init ---
        const picker = flatpickr(pickerEl, {
            enableTime: true,
            enableSeconds: true,
            dateFormat: 'Y-m-d H:i:S',
            time_24hr: true,
            allowInput: true,
            disableMobile: true,
            onChange: (selectedDates) => {
                if (suppressSync) return;
                if (selectedDates.length === 0) return;
                const pickerMs = selectedDates[0].getTime();
                // Re-attach preserved sub-second remainder.
                const merged = pickerMs + state.subMs;
                setMs(merged, state.unit || 'ms', 'picker');
            },
        });

        // --- Event wiring ---
        inputEl.addEventListener('input', () => {
            const raw = inputEl.value;
            if (!raw.trim()) {
                setEmpty();
                state.ms = null;
                state.subMs = 0;
                return;
            }
            const detection = detectUnit(raw);
            if (!detection) {
                setError('Not a numeric timestamp');
                return;
            }
            const ms = toMillis(raw, detection.unit);
            setMs(ms, detection.unit, 'input');
        });

        // Offset buttons — shift current state by a ms delta.
        document.querySelectorAll('.offset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (state.ms === null) return;
                const delta = Number(btn.dataset.offset);
                setMs(state.ms + delta, state.unit, 'offset');
            });
        });

        // Click-to-copy on result fields (except relative — it drifts with "now").
        for (const [key, el] of Object.entries(fields)) {
            if (key === 'relative') continue;
            el.addEventListener('animationend', () => {
                el.classList.remove('copied');
            });
            el.addEventListener('click', () => {
                const text = el.dataset.copy;
                if (!text) return;
                navigator.clipboard.writeText(text).then(() => {
                    // Re-trigger animation even on rapid repeat clicks.
                    el.classList.remove('copied');
                    void el.offsetWidth;
                    el.classList.add('copied');
                    showMessage('Copied', 'success');
                }).catch(() => {
                    showMessage('Copy failed', 'error');
                });
            });
        }

        // Initial seed — use the example timestamp.
        inputEl.value = '1760556959473';
        const seedDetect = detectUnit(inputEl.value);
        setMs(toMillis(inputEl.value, seedDetect.unit), seedDetect.unit, 'input');
        inputEl.focus();
        inputEl.select();
    </script>
</body>

</html>
